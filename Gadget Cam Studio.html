<style>[hidden]{display:none !important}
:root{
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  --bg:#f5f5f7; --bg2:#ececf0; --panel:rgba(255,255,255,.78); --solid:#ffffff; --raise:#ffffff;
  --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.14); --text:#1d1d1f; --dim:#6e6e73; --faint:#a1a1a6;
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --accent:#0a7cff; --accent-soft:rgba(10,124,255,.12); --rec:#ff3b30; --ok:#28c840; --warn:#ff9f0a;
  --stage:#e8e8ed; --tile:#000; --shadow:0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
  --r:12px; --sidebar:248px; --inspector:340px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1c1e; --bg2:#242426; --panel:rgba(36,36,38,.78); --solid:#2c2c2e; --raise:#636366;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14); --text:#f5f5f7; --dim:#98989d; --faint:#636366;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
    --accent:#0a84ff; --accent-soft:rgba(10,132,255,.2); --stage:#111113;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:default}
::selection{background:var(--accent-soft)}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:15px;height:15px}
.ic.fillc{fill:currentColor;stroke:none}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:var(--sidebar) 1fr var(--inspector);grid-template-rows:52px 1fr;height:100vh;transition:grid-template-columns .25s ease}
#app.no-side{grid-template-columns:0 1fr var(--inspector)}
#app.no-insp{grid-template-columns:var(--sidebar) 1fr 0}
#app.no-side.no-insp{grid-template-columns:0 1fr 0}
.toolbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);position:relative;z-index:5;-webkit-app-region:drag}
.toolbar>*{-webkit-app-region:no-drag}
.toolbar .title{font-weight:600;font-size:14px;margin-left:4px;-webkit-app-region:drag}
.toolbar .center{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px}
.toolbar .right{margin-left:auto;display:flex;align-items:center;gap:6px}
body.native .toolbar .right{margin-right:140px}

.tb{height:30px;min-width:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;background:transparent;color:var(--dim)}
.tb:hover{background:var(--fill);color:var(--text)}
.tb.on{color:var(--accent)}
.tb:disabled{opacity:.35}
.pill{height:26px;padding:0 10px;border-radius:13px;background:var(--fill);color:var(--dim);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.warn{background:rgba(255,159,10,.16);color:var(--warn)}
.pill.bad{background:rgba(255,59,48,.14);color:var(--rec)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

/* record cluster */
.recbtn{width:38px;height:38px;border-radius:50%;border:3px solid var(--line2);background:transparent;display:grid;place-items:center;padding:0;transition:transform .1s}
.recbtn:active{transform:scale(.94)}
.recbtn i{width:22px;height:22px;border-radius:50%;background:var(--rec);transition:all .2s ease}
.recbtn.on i{width:14px;height:14px;border-radius:3px}
.recbtn.counting i{animation:pulse 1s infinite}
.recbtn:disabled{opacity:.4}
@keyframes pulse{50%{opacity:.35}}
.timer{font:600 15px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--dim);min-width:74px}
.timer.on{color:var(--rec)}

/* ---------- sidebar ---------- */
.sidebar{background:var(--panel);backdrop-filter:saturate(180%) blur(20px);border-right:1px solid var(--line);overflow:hidden auto;display:flex;flex-direction:column;min-width:0}
.sidebar .inner{padding:12px 10px;display:flex;flex-direction:column;gap:18px;min-width:var(--sidebar)}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:0 8px 4px;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.sec-h .tb{height:22px;min-width:22px;padding:0}
.item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;color:var(--text);min-height:30px;position:relative}
.item:hover{background:var(--fill)}
.item.sel{background:var(--accent);color:#fff}
.item.sel .sub,.item.sel .ic{color:rgba(255,255,255,.85)}
.item .ic{color:var(--accent)}
.item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:11px;color:var(--dim)}
.item .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.item .dot.live{background:var(--ok)}
.item .dot.lost,.item .dot.error,.item .dot.busy{background:var(--rec)}
.item .dot.opening{background:var(--warn)}
.item .x{opacity:0;border:0;background:none;color:inherit;padding:2px;border-radius:5px;display:grid}
.item:hover .x{opacity:.6}
.item .x:hover{opacity:1;background:var(--fill2)}
.empty-note{font-size:12px;color:var(--faint);padding:2px 8px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:34px;border-radius:9px;border:0;background:var(--accent);color:#fff;font-weight:600;width:100%}
.bigbtn:hover{filter:brightness(1.08)}
.bigbtn.secondary{background:var(--fill);color:var(--text);font-weight:500}
.foot{margin-top:auto;padding:10px;border-top:1px solid var(--line);min-width:var(--sidebar)}

/* ---------- stage ---------- */
.stage{background:var(--stage);display:flex;flex-direction:column;min-width:0;min-height:0}
#grid{flex:1;overflow:auto;padding:16px;display:grid;gap:14px;align-content:start;grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
#grid.one{grid-template-columns:1fr}
.tile{position:relative;border-radius:var(--r);overflow:hidden;background:var(--tile);box-shadow:var(--shadow);aspect-ratio:16/9;outline:2px solid transparent;outline-offset:2px;transition:outline-color .15s}
.tile.sel{outline-color:var(--accent)}
.tile.rec{box-shadow:0 0 0 2px var(--rec),var(--shadow)}
.tile canvas,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tile video{opacity:0;pointer-events:none}
.tile.grab canvas{cursor:grab}
.tile .ov{position:absolute;display:flex;gap:6px;align-items:center}
.tile .tl{top:10px;left:10px}
.tile .tr{top:10px;right:10px}
.tile .bl{bottom:10px;left:10px}
.tile .br{bottom:10px;right:10px;opacity:0;transition:opacity .15s}
.tile:hover .br{opacity:1}
.chip-o{height:24px;padding:0 9px;border-radius:12px;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);color:#fff;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;border:0}
.chip-o.mono{font:500 11px var(--mono)}
.chip-o.red{background:var(--rec)}
.chip-o.warn{background:rgba(255,159,10,.9);color:#000}
.chip-o.blue{background:rgba(10,132,255,.85)}
.chip-o.green{background:var(--ok);color:#fff;font-weight:700;letter-spacing:.03em;font-size:11px}
button.chip-o:hover{background:rgba(0,0,0,.7)}
.tile .msg{position:absolute;inset:0;display:grid;place-items:center;color:#d1d1d6;text-align:center;padding:20px;font-size:13px}
.tile .msg b{display:block;font-size:15px;color:#fff;margin-bottom:4px}
.tile.drop::after{content:"Drop .cube LUT or image";position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,132,255,.35);color:#fff;font-weight:600;border-radius:var(--r)}
.addtile{border:1.5px dashed var(--line2);background:transparent;border-radius:var(--r);aspect-ratio:16/9;display:grid;place-items:center;color:var(--dim);font-size:14px}
.addtile:hover{background:var(--fill);color:var(--text)}
.addtile .ic{width:26px;height:26px;margin:0 auto 6px;display:block}

/* ---------- mixer dock ---------- */
.dock{border-top:1px solid var(--line);background:var(--panel);backdrop-filter:saturate(180%) blur(20px)}
.dock-h{display:flex;align-items:center;gap:8px;padding:6px 12px;height:38px}
.dock-h b{font-weight:600}
.dock-h .hint{color:var(--faint);font-size:12px}
.dock-b{display:flex;gap:8px;padding:0 12px 12px;overflow-x:auto}
.dock.collapsed .dock-b{display:none}
.strip{flex:none;width:132px;border-radius:10px;background:var(--solid);border:1px solid var(--line);padding:8px 8px 6px;display:flex;flex-direction:column;gap:6px;cursor:default}
.strip.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.strip.dead{opacity:.5}
.strip .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .pz{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-5px}
.strip .body{display:flex;gap:6px;height:128px;flex:none;justify-content:center}
.strip .body>.vm{margin-top:16px}
.strip .row{display:flex;gap:4px}
.strip .row button{flex:1;height:22px;border-radius:6px;border:0;background:var(--fill);font-size:10px;font-weight:600;color:var(--dim);padding:0;letter-spacing:.02em}
.strip .row button.on{background:var(--accent-soft);color:var(--accent)}
.strip .row button.mute.on{background:var(--rec);color:#fff}
.strip.master{background:transparent;border-style:dashed}
.vm{width:8px;border-radius:4px;background:var(--fill);position:relative;overflow:hidden}
.vm i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--ok) 0 70%,var(--warn) 70% 90%,var(--rec) 90%);background-size:100% 128px;background-position:bottom;border-radius:4px}
.vm b{position:absolute;left:0;right:0;height:2px;background:var(--text);opacity:.6}
.fcol{display:flex;flex-direction:column;align-items:center;gap:3px;width:34px}
.fcol .v{font:500 10px var(--mono);color:var(--dim);height:13px}
.fcol .lb{font-size:9.5px;font-weight:700;color:var(--faint);letter-spacing:.04em}
input.vf{writing-mode:vertical-lr;direction:rtl;flex:1 1 0;min-height:0;height:100%;width:22px;margin:0;-webkit-appearance:none;appearance:none;background:transparent}
input.vf::-webkit-slider-runnable-track{width:4px;border-radius:2px;background:var(--fill2)}
input.vf::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:12px;border-radius:4px;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 1px 3px rgba(0,0,0,.3);margin-left:-8px}
input.vf.mon::-webkit-slider-thumb{background:#e9e3ff}

/* ---------- inspector ---------- */
.inspector{background:var(--panel);backdrop-filter:saturate(180%) blur(20px);border-left:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.insp-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);min-width:var(--inspector)}
.insp-h .t{display:flex;align-items:center;gap:8px}
.insp-h input.name{flex:1;border:0;background:transparent;font-size:16px;font-weight:650;padding:2px 4px;margin-left:-4px;border-radius:6px;min-width:0}
.insp-h input.name:hover,.insp-h input.name:focus{background:var(--fill);outline:0}
.insp-h .s{color:var(--dim);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insp-b{flex:1;overflow:auto;padding:12px 16px 30px;min-width:var(--inspector)}
.insp-empty{display:grid;place-items:center;height:100%;color:var(--faint);text-align:center;padding:30px;min-width:var(--inspector)}
.insp-empty .ic{width:36px;height:36px;margin:0 auto 8px;display:block}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;height:26px;border-radius:7px;font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;padding:0 6px}
.seg button.on{background:var(--raise);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg.tabs{margin-top:12px}

.group{background:var(--solid);border:1px solid var(--line);border-radius:11px;padding:4px 12px;margin-bottom:12px}
.group-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 6px}
.group-h:first-child{margin-top:4px}
.group-h button{border:0;background:none;color:var(--accent);font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;padding:0}
.r{display:flex;align-items:center;gap:10px;min-height:38px;padding:4px 0;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}
.r>.lb{flex:1;min-width:0}
.r>.lb small{display:block;color:var(--dim);font-size:11.5px;line-height:1.3}
.r select,.r input[type=text],.r input[type=time],.r input[type=number]{background:var(--fill);border:0;border-radius:7px;height:28px;padding:0 8px;max-width:170px}
.r input[type=color]{width:34px;height:24px;border:0;padding:0;background:none;border-radius:6px}
.sl{padding:8px 0 6px;border-bottom:1px solid var(--line)}
.sl:last-child{border-bottom:0}
.sl .top{display:flex;justify-content:space-between;font-size:12.5px}
.sl output{color:var(--dim);font:12px var(--mono);font-variant-numeric:tabular-nums}
.sl.changed .top span{color:var(--accent);font-weight:500}
input[type=range].s{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:2px 0 0}
input[type=range].s::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--fill2) var(--p,50%))}
input[type=range].s.center::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--fill2) min(var(--p),50%),var(--accent) min(var(--p),50%),var(--accent) max(var(--p),50%),var(--fill2) max(var(--p),50%))}
input[type=range].s::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 2px 5px rgba(0,0,0,.22)}
.sw{position:relative;width:40px;height:24px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0}
.sw i{position:absolute;inset:0;border-radius:12px;background:var(--fill2);transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(16px)}
.btn{height:28px;padding:0 12px;border-radius:8px;border:0;background:var(--fill);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--fill2)}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--rec)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.btns .btn{flex:1;justify-content:center}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);background:var(--solid);border-radius:10px;padding:8px 10px;text-align:left;min-height:52px;position:relative}
.card:hover{border-color:var(--line2)}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.card b{display:block;font-size:12.5px;font-weight:600}
.card span{display:block;font-size:11px;color:var(--dim);line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .del{position:absolute;top:4px;right:4px;border:0;background:none;color:var(--faint);padding:2px;border-radius:5px;display:none}
.card:hover .del{display:grid}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 11px;border-radius:14px;border:0;background:var(--fill);font-size:12px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--fill2)}
.chip.on{background:var(--accent);color:#fff}
.chip .del{opacity:.6;font-style:normal}
.cat{font-size:11.5px;color:var(--dim);margin:12px 2px 6px;font-weight:500}
.now{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:11px;padding:10px 12px;margin-bottom:12px}
.now b{display:block}
.now span{font-size:12px;color:var(--dim)}
.now em{font-style:normal;font-size:11px;font-weight:600;color:var(--warn);margin-left:6px}
.eqc{width:100%;aspect-ratio:680/220;display:block;border-radius:11px;background:var(--solid);border:1px solid var(--line);margin-bottom:12px}
.savebar{display:flex;gap:6px;margin-top:10px}
.savebar input{flex:1;background:var(--fill);border:0;border-radius:8px;height:30px;padding:0 10px;min-width:0}
.adv{display:none}
.showadv .adv{display:block}
.note{font-size:12px;color:var(--dim);padding:6px 4px 0}

/* ---------- overlays ---------- */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg)}
#gate .card-g{width:420px;text-align:center;padding:36px}
#gate .logo{width:76px;height:76px;border-radius:20px;margin:0 auto 18px;background:linear-gradient(145deg,#3a3a3c,#111);display:grid;place-items:center;box-shadow:var(--shadow)}
#gate .logo i{width:30px;height:30px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 6px rgba(255,59,48,.18)}
#gate .logo-img{display:block;margin:0 auto 14px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.25))}
#gate h1{font-size:26px;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
#gate p{color:var(--dim);margin:0 0 24px;font-size:14px}
#gate .err{color:var(--rec);margin-top:14px;font-size:13px}
#gate .bigbtn{height:40px;font-size:14px}
#countdown{position:fixed;inset:0;z-index:40;display:none;place-items:center;pointer-events:none}
#countdown.on{display:grid}
#countdown b{font-size:180px;font-weight:700;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.5);animation:pop 1s ease}
@keyframes pop{0%{transform:scale(1.4);opacity:0}20%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:.2}}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(30,30,32,.92);color:#fff;padding:9px 16px;border-radius:12px;backdrop-filter:blur(20px);box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:13px;transform:translateY(10px);opacity:0;transition:all .25s;max-width:520px}
.toast.in{transform:none;opacity:1}
.toast.err{background:rgba(255,59,48,.95)}
dialog{border:0;border-radius:16px;padding:0;background:var(--bg);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.35);width:560px;max-width:92vw;max-height:86vh}
dialog::backdrop{background:rgba(0,0,0,.28);backdrop-filter:blur(2px)}
dialog .dh{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
dialog .dh b{font-size:15px;flex:1}
dialog .db{padding:14px 18px 20px;overflow:auto;max-height:calc(86vh - 60px)}
#activity{font-size:12px;color:var(--dim);max-height:180px;overflow:auto}
#activity div{padding:3px 0;border-bottom:1px solid var(--line)}
#activity time{color:var(--faint);margin-right:8px;font-family:var(--mono);font-size:11px}
.perfbar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.perfbar i{display:block;height:100%;border-radius:4px;background:var(--ok);transition:width .3s}
.perfbar.heavy i{background:var(--warn)}
.perfbar.over i{background:var(--rec)}
button.pill{cursor:default}
button.pill:hover{filter:brightness(.97)}
kbd{font:11px var(--mono);background:var(--fill);border-radius:5px;padding:1px 6px;border:1px solid var(--line)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;font-size:12.5px}

/* ---------- preview layouts ---------- */
#stagebar{display:flex;align-items:center;gap:10px;padding:10px 16px 0}
#stagebar .seg{width:auto}
#stagebar .seg button{padding:0 14px}
#stagebar .nav{display:flex;align-items:center;gap:2px;font-weight:600;font-size:12.5px}
#stagebar .nav .tb{font-size:18px;height:26px;min-width:26px}
#stagebar .hint{color:var(--faint);font-size:12px}
#stagebar select{margin-left:auto;background:var(--fill);border:0;border-radius:8px;height:28px;padding:0 8px}
#grid{--gh:600px}
#grid.v-spotlight,#grid.v-output{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));align-content:start}
#grid.v-spotlight .tile.focus,#grid.v-output .tile.focus{grid-column:1/-1;justify-self:center;width:100%;max-width:calc((var(--gh) - 190px) * 16 / 9)}
#grid.v-single{grid-template-columns:1fr;align-content:center}
#grid.v-single .tile.focus{justify-self:center;width:100%;max-width:calc((var(--gh) - 36px) * 16 / 9)}
#grid .tile.hidden-v{display:none}
.tile.thumb{border-radius:9px;cursor:pointer}
.tile.thumb .bl,.tile.thumb .br,.tile.thumb .tr .fpsw,.tile.thumb .tr .lutc,.tile.thumb .vguide{display:none}
.tile.thumb .chip-o{height:20px;font-size:11px;padding:0 7px}
.tile.thumb .ov.tl{top:6px;left:6px}
.tile.thumb .ov.tr{top:6px;right:6px}
.tile.thumb .msg{font-size:11px;padding:6px}
.tile.thumb .msg b{font-size:12px}
.tile.onout{box-shadow:0 0 0 2.5px var(--ok),var(--shadow)}
.tile.outtile canvas{object-fit:contain}
.guides{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;fill:none;stroke:rgba(255,255,255,.55);stroke-width:.25;vector-effect:non-scaling-stroke}
.guides *{vector-effect:non-scaling-stroke;stroke-width:1.2}

.insp-h .presetbtn{height:26px;font-size:12px;padding:0 9px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.card .del{display:none}
.card:hover .del{display:grid}

/* ---------- name builder ---------- */
.nprev{background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.nlab{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.nval{font:500 15px var(--mono);margin-top:4px;word-break:break-all}
.nval span{color:var(--faint)}
.nparts{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:36px}
.npart{display:inline-flex;align-items:center;height:32px;border-radius:9px;background:var(--accent);color:#fff;padding:0 2px;font-size:13px}
.npart.txt{background:var(--fill2);color:var(--text)}
.npart b{font-weight:600;padding:0 4px}
.npart button{border:0;background:transparent;color:inherit;opacity:.75;width:22px;height:28px;border-radius:6px;font-size:16px;padding:0}
.npart button:hover:not(:disabled){opacity:1;background:rgba(255,255,255,.18)}
.npart button:disabled{opacity:.25}
.npart .ntxt{border:0;background:var(--solid);color:var(--text);border-radius:6px;height:24px;padding:0 6px;font:13px var(--mono);min-width:40px}
.nsep{color:var(--faint);font:600 14px var(--mono);padding:0 2px}

.tile .nm{cursor:text}
.tile.thumb .nm{cursor:pointer}
.nmedit{border:0;background:transparent;color:#fff;font:inherit;width:150px;outline:0;padding:0}
.sec-h span{display:flex;gap:2px}

/* ---------- screen picker ---------- */
.srcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.srcpick{border:1px solid var(--line);background:var(--solid);border-radius:10px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:6px}
.srcpick:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.srcpick>img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:6px}
.srcpick span{font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcpick .ico{width:16px;height:16px}

/* =====================================================================
   Liquid glass theme (body.glass). Floating translucent panels over an
   ambient backdrop. "Reduce transparency" (body.solid) turns it off.
   ===================================================================== */
body.glass{
  --g-fill:rgba(255,255,255,.52); --g-fill2:rgba(255,255,255,.34); --g-edge:rgba(255,255,255,.75); --g-edge2:rgba(255,255,255,.25);
  --g-shadow:0 1px 1px rgba(0,0,0,.04), 0 12px 40px rgba(20,30,60,.16); --g-blur:saturate(190%) blur(28px);
  --stage:transparent; --solid:rgba(255,255,255,.62); --raise:rgba(255,255,255,.92); --fill:rgba(255,255,255,.42); --fill2:rgba(255,255,255,.62);
  --line:rgba(255,255,255,.55); --line2:rgba(0,0,0,.08);
  background:#dfe6f2;
}
@media (prefers-color-scheme: dark){
  body.glass{
    --g-fill:rgba(38,40,48,.46); --g-fill2:rgba(60,62,72,.32); --g-edge:rgba(255,255,255,.22); --g-edge2:rgba(255,255,255,.06);
    --g-shadow:0 1px 1px rgba(0,0,0,.3), 0 16px 50px rgba(0,0,0,.45);
    --solid:rgba(58,60,70,.5); --raise:rgba(110,112,124,.7); --fill:rgba(255,255,255,.08); --fill2:rgba(255,255,255,.16);
    --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.16);
    background:#0c0d12;
  }
}
/* ambient backdrop: soft color fields + a heavily blurred glimpse of the main camera */
#ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;display:none}
body.glass #ambient{display:block}
#ambient canvas{position:absolute;inset:-10%;width:120%;height:120%;filter:blur(70px) saturate(160%);opacity:.55;transition:opacity 1s}
#ambient i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
#ambient i:nth-child(2){width:46vw;height:46vw;left:-8vw;top:-12vw;background:#7aa7ff}
#ambient i:nth-child(3){width:40vw;height:40vw;right:-10vw;top:20vh;background:#c49bff}
#ambient i:nth-child(4){width:38vw;height:38vw;left:30vw;bottom:-18vw;background:#7ff0d8}
@media (prefers-color-scheme: dark){ #ambient i{opacity:.28} #ambient canvas{opacity:.4} }

/* glass material */
body.glass .toolbar, body.glass .sidebar, body.glass .inspector, body.glass .dock, body.glass #stagebar,
body.glass dialog, body.glass .toast, body.glass #addInMenu{
  background:linear-gradient(180deg, var(--g-fill2), transparent 60%), var(--g-fill);
  backdrop-filter:var(--g-blur); -webkit-backdrop-filter:var(--g-blur);
  border:1px solid var(--g-edge2);
  box-shadow:inset 0 1px 0 var(--g-edge), inset 0 0 0 .5px var(--g-edge2), var(--g-shadow);
}
/* floating layout */
body.glass #app{padding:10px;gap:10px;grid-template-rows:52px 1fr}
body.glass .toolbar{border-radius:20px;border-bottom:1px solid var(--g-edge2)}
body.glass .sidebar, body.glass .inspector{border-radius:22px;border-left:1px solid var(--g-edge2);border-right:1px solid var(--g-edge2)}
body.glass .stage{background:transparent;border-radius:22px;overflow:hidden}
body.glass .dock{margin:10px 0 0;border-radius:22px;border-top:1px solid var(--g-edge2)}
body.glass #stagebar{margin:0 16px;padding:6px;border-radius:16px;width:max-content;max-width:calc(100% - 32px)}
body.glass #stagebar select{margin-left:12px}
body.glass #grid{padding-top:12px}
body.glass .foot{border-top:1px solid var(--line)}
body.glass #app.no-side .sidebar, body.glass #app.no-insp .inspector{border:0;box-shadow:none;padding:0}
body.glass #app.no-side{grid-template-columns:0 1fr var(--inspector);gap:10px 0}
body.glass #app.no-side .stage{margin-left:0}

/* surfaces inside panels */
body.glass .group{background:var(--solid);border:1px solid var(--g-edge2);box-shadow:inset 0 1px 0 var(--g-edge);border-radius:16px}
body.glass .card{background:var(--solid);border:1px solid var(--g-edge2);box-shadow:inset 0 1px 0 var(--g-edge);border-radius:14px}
body.glass .card.on{background:linear-gradient(180deg,rgba(10,132,255,.22),rgba(10,132,255,.12));border-color:rgba(10,132,255,.6)}
body.glass .now{background:linear-gradient(135deg,rgba(10,132,255,.2),rgba(150,110,255,.14));border:1px solid var(--g-edge2);box-shadow:inset 0 1px 0 var(--g-edge);border-radius:16px}
body.glass .strip{background:var(--solid);border:1px solid var(--g-edge2);box-shadow:inset 0 1px 0 var(--g-edge);border-radius:16px}
body.glass .strip.master{background:transparent}
body.glass .eqc, body.glass .nprev{background:var(--solid);border:1px solid var(--g-edge2);border-radius:16px}

/* capsules */
body.glass .btn, body.glass .chip, body.glass .seg, body.glass .pill, body.glass .r select, body.glass .r input[type=text], body.glass .r input[type=number], body.glass .savebar input{
  border-radius:999px;background:var(--fill);box-shadow:inset 0 1px 0 var(--g-edge), inset 0 0 0 .5px var(--g-edge2)}
body.glass .btn.primary, body.glass .bigbtn, body.glass .chip.on{background:linear-gradient(180deg,#3d9bff,#0a7cff);box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 4px 14px rgba(10,124,255,.35)}
body.glass .bigbtn{border-radius:999px}
body.glass .seg{padding:3px}
body.glass .seg button{border-radius:999px}
body.glass .seg button.on{background:var(--raise);box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 2px 8px rgba(0,0,0,.14)}
body.glass .tb{border-radius:12px}
body.glass .item{border-radius:12px}
body.glass .item.sel{background:linear-gradient(180deg,#3d9bff,#0a7cff);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
body.glass .pill.warn{background:rgba(255,159,10,.22)}
body.glass .pill.bad{background:rgba(255,59,48,.2)}

/* glass record button */
body.glass .recbtn{width:44px;height:44px;border:0;background:var(--fill);box-shadow:inset 0 1px 0 var(--g-edge), inset 0 0 0 1px var(--g-edge2), 0 6px 18px rgba(0,0,0,.12);backdrop-filter:blur(10px)}
body.glass .recbtn i{background:radial-gradient(circle at 35% 30%,#ff7a70,#ff3b30 60%,#d42a20);box-shadow:0 2px 10px rgba(255,59,48,.45)}

/* video tiles keep crisp edges with a glass rim */
body.glass .tile{border-radius:18px;box-shadow:0 0 0 1px var(--g-edge2), 0 10px 30px rgba(0,0,0,.18)}
body.glass .tile.sel{outline:2px solid #0a84ff;outline-offset:3px}
body.glass .chip-o{background:rgba(20,20,24,.38);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 .5px rgba(255,255,255,.15);border-radius:999px}
body.glass .addtile{border-radius:18px;border:1.5px dashed var(--g-edge);background:var(--g-fill2);backdrop-filter:blur(10px)}

/* sliders and switches */
body.glass input[type=range].s::-webkit-slider-thumb{width:22px;height:22px;margin-top:-9px;background:linear-gradient(180deg,#fff,#eef1f6);box-shadow:inset 0 1px 0 #fff, 0 0 0 .5px rgba(0,0,0,.12), 0 3px 8px rgba(0,0,0,.2)}
body.glass input[type=range].s::-webkit-slider-runnable-track{height:5px;border-radius:3px}
body.glass .sw i{box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
body.glass .sw i::after{background:linear-gradient(180deg,#fff,#f0f2f6);box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(0,0,0,.25)}

/* sheets */
body.glass dialog{border-radius:26px}
body.glass dialog::backdrop{background:rgba(0,0,0,.18);backdrop-filter:blur(6px)}
body.glass dialog .dh{border-bottom:1px solid var(--line)}
body.glass .toast{color:var(--text);border-radius:999px;padding:10px 18px}
body.glass .toast.err{background:rgba(255,59,48,.85);color:#fff}
body.glass #gate{background:transparent}
body.glass #gate .card-g{background:var(--g-fill);backdrop-filter:var(--g-blur);-webkit-backdrop-filter:var(--g-blur);border-radius:32px;border:1px solid var(--g-edge2);box-shadow:inset 0 1px 0 var(--g-edge), var(--g-shadow)}

/* reduce transparency */
body.glass.solid{--g-fill:var(--bg2);--g-fill2:transparent}
body.glass.solid .toolbar, body.glass.solid .sidebar, body.glass.solid .inspector, body.glass.solid .dock, body.glass.solid #stagebar, body.glass.solid dialog, body.glass.solid .chip-o{backdrop-filter:none;-webkit-backdrop-filter:none}
body.glass.solid #ambient{display:none}

/* ---------- compact (no tips): labels and values only ---------- */
body.compact .note:not(.keep), body.compact .empty-note.long{display:none}
body.compact .card span{display:none}
body.compact .card{min-height:0;padding:9px 11px}
body.compact .cards{grid-template-columns:repeat(3,1fr)}
body.compact .card b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.compact .now span{display:none}
body.compact .now{padding:8px 12px}
body.compact .r[title] .lb{cursor:help}
body.compact .r[title] .lb::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--faint);opacity:.6;margin-left:6px;vertical-align:middle}
body.compact .dock-h .hint, body.compact #stagebar .hint{display:none}
body.compact .insp-h .s{font-size:11.5px}
#grid{grid-auto-rows:max-content}

.mypre{background:var(--solid);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
body.glass .mypre{border-color:var(--g-edge2);box-shadow:inset 0 1px 0 var(--g-edge);border-radius:16px}
.mypre .savebar{margin-top:10px}

/* ---------- mix presets & roles ---------- */
#mixBar select{background:var(--fill);border:0;border-radius:999px;height:28px;padding:0 12px;font-weight:500}
#duckBtn.on{color:var(--accent)}
#duckBtn.active{background:var(--accent);color:#fff}
.role{border:0;border-radius:6px;height:16px;padding:0 5px;font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;vertical-align:1px;color:#fff;background:#8e8e93;cursor:pointer}
.role.r-voice{background:#0a84ff}.role.r-game{background:#bf5af2}.role.r-clip{background:#ff9f0a}.role.r-music{background:#30d158}

/* ===== Motion ===== */
:root{--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
/* press + hover feedback everywhere */
.btn,.chip,.seg button,.item,.strip .row button,.role,.toolbar button,#mixBar select,.recbtn{transition:transform .18s var(--spring),background-color .2s var(--ease),color .2s var(--ease),box-shadow .25s var(--ease),opacity .2s}
.btn:active,.chip:active,.seg button:active,.strip .row button:active,.role:active,.toolbar button:active{transform:scale(.94)}
.item:active{transform:scale(.98)}
.chip.on{animation:m-chip .35s var(--spring)}
@keyframes m-chip{0%{transform:scale(.9)}100%{transform:none}}
.seg button.on{transition:background-color .25s var(--ease),box-shadow .25s var(--ease)}
/* switches: springy knob */
.sw i::after{transition:transform .32s var(--spring),width .2s var(--ease)}
.sw:active i::after{width:24px}
/* sliders: thumb grows while dragging */
input[type=range]::-webkit-slider-thumb{transition:transform .18s var(--spring),box-shadow .2s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
/* entrances */
.m-enter{animation:m-in .42s var(--ease) both}
@keyframes m-in{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.m-pop{animation:m-pop .34s var(--spring) both}
@keyframes m-pop{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
dialog[open]::backdrop{animation:m-fade .25s var(--ease)}
@keyframes m-fade{from{opacity:0}}
#insp.m-insp .insp-h,#insp.m-insp .insp-b>*{animation:m-in .4s var(--ease) both}
#insp.m-insp .insp-b>*:nth-child(2){animation-delay:.03s}#insp.m-insp .insp-b>*:nth-child(3){animation-delay:.06s}
#insp.m-insp .insp-b>*:nth-child(4){animation-delay:.09s}#insp.m-insp .insp-b>*:nth-child(5){animation-delay:.12s}
#insp.m-insp .insp-b>*:nth-child(n+6){animation-delay:.15s}
.toast{transition:transform .38s var(--spring),opacity .25s var(--ease)!important}
.tile{transition:outline-color .25s var(--ease),box-shadow .3s var(--ease)}
.tile .ov{transition:opacity .2s var(--ease),transform .25s var(--ease)}
.chip-o.red.rc:not([hidden]){animation:m-recglow 1.6s ease-in-out infinite}
@keyframes m-recglow{50%{box-shadow:0 0 0 4px rgba(255,59,48,.25)}}
#gate:not([hidden]) > *{animation:m-in .6s var(--ease) both}
/* audio: meters glow, talking strips light up, ducked strips dip */
.vm i{transition:height 60ms linear;box-shadow:0 0 8px rgba(52,199,89,.0)}
.strip{transition:border-color .25s var(--ease),box-shadow .25s var(--ease),transform .3s var(--ease),opacity .3s}
.strip.talking:not(.master){box-shadow:0 0 0 1px color-mix(in srgb,var(--ok) calc(var(--lvl,0)*70%),transparent),0 6px 22px -6px color-mix(in srgb,var(--ok) calc(var(--lvl,0)*60%),transparent)}
.strip.talking .vm i{box-shadow:0 0 10px rgba(52,199,89,.55)}
.strip.ducked{opacity:.72}
.strip.ducked .pz::after{content:" · ducked";color:var(--accent);animation:m-fade .25s}
#duckBtn.active{animation:m-breathe 1.2s ease-in-out infinite}
@keyframes m-breathe{50%{box-shadow:0 0 0 4px var(--accent-soft)}}
#soundCheck:disabled{animation:m-breathe 1s ease-in-out infinite;opacity:1}
/* AI voice cleanup */
.aibadge{display:inline-grid;place-items:center;height:16px;padding:0 5px;border-radius:5px;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:#fff;vertical-align:1px;margin-left:4px;
  background:linear-gradient(110deg,#7b61ff,#0a84ff 40%,#5ac8fa 55%,#7b61ff);background-size:250% 100%;animation:m-shine 4s linear infinite}
@keyframes m-shine{to{background-position:-250% 0}}
.ai-row.off{opacity:.55}
.sw.dis{pointer-events:none}
.ai-row.live .sw i{box-shadow:0 0 0 3px rgba(10,132,255,.18)}
.note.keep.ai-note{display:block;margin:-2px 0 6px;font-size:11.5px}
.strip .body{position:relative}
.strip-ai{position:absolute;top:-2px;left:2px;margin:0;transform:scale(calc(.9 + var(--lvl,0)*.25));transition:transform 90ms linear}
/* respect reduce motion */
body.nomotion *,body.nomotion *::before,body.nomotion *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== Titles, chapters, phone controls ===== */
.trow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.trow .tin{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.trow input{height:26px;border-radius:7px;border:1px solid var(--line);background:var(--fill);padding:0 8px;font:inherit;font-size:12.5px;color:var(--text);min-width:0}
.trow input.l1{font-weight:600}
.trow .tbtns{display:flex;gap:4px;align-items:center}
.trow .tbtns .btn{min-width:56px;justify-content:center}
.trow .x{border:0;background:transparent;color:var(--dim);padding:4px;border-radius:6px}
input.tcolor{width:40px;height:26px;border:0;background:none;padding:0}
.chapdlg .r.chap{display:flex;align-items:center;gap:10px;padding:6px 0}
.chapdlg .tc{font:12px var(--mono);color:var(--dim);width:54px}
.chapdlg input{flex:1;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--fill);padding:0 10px;font:inherit;color:var(--text)}
</style>

<script>(() => {
"use strict";
// ---- 00-core.js ----
// Core helpers: DOM, storage, IndexedDB, formatting, icons, toasts.
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Math.random().toString(36).slice(2, 9);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const NATIVE = window.mcrNative || null;          // present only in the installable Windows app

const store = {
  get(k, d) { try { const v = localStorage.getItem('mcr2_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mcr2_' + k, JSON.stringify(v)); } catch {} },
};

// IndexedDB: luts (parsed .cube), blobs (background images), handles (save folder)
let _db = null;
function idb() {
  if (!_db) _db = new Promise((res, rej) => {
    const r = indexedDB.open('multicam-recorder-2', 1);
    r.onupgradeneeded = () => ['luts', 'blobs', 'handles'].forEach(n => r.result.objectStoreNames.contains(n) || r.result.createObjectStore(n));
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return _db;
}
async function idbDo(storeName, mode, fn) {
  try {
    const d = await idb();
    return await new Promise((res, rej) => {
      const tx = d.transaction(storeName, mode), req = fn(tx.objectStore(storeName));
      tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
    });
  } catch (e) { console.warn('IndexedDB', e); return undefined; }
}
const idbGet = (s, k) => idbDo(s, 'readonly', st => st.get(k));
const idbPut = (s, k, v) => idbDo(s, 'readwrite', st => st.put(v, k));
const idbDel = (s, k) => idbDo(s, 'readwrite', st => st.delete(k));
const idbAll = s => idbDo(s, 'readonly', st => st.getAll());

// Formatting
const fmtTime = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return [s / 3600 | 0, (s % 3600) / 60 | 0, s % 60].map(n => String(n).padStart(2, '0')).join(':'); };
const fmtBytes = b => b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b >= 1e6 ? Math.round(b / 1e6) + ' MB' : Math.round(b / 1e3) + ' KB';
const fmtDur = sec => sec >= 3600 ? `${(sec / 3600).toFixed(1)} h` : `${Math.round(sec / 60)} min`;
const safeName = s => String(s).replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'cam';

// Activity log + toasts
const activity = [];
function log(msg) {
  activity.unshift({ t: new Date(), msg });
  if (activity.length > 200) activity.pop();
  const el = $('#activity'); if (el) el.prepend(h(`<div><time>${new Date().toLocaleTimeString([], { hour:'numeric', minute:'2-digit', second:'2-digit' })}</time>${esc(msg)}</div>`));
}
function toast(msg, kind = '') {
  const host = $('#toasts'); if (!host) return;
  const t = h(`<div class="toast ${kind}">${esc(msg)}</div>`);
  host.appendChild(t);
  requestAnimationFrame(() => t.classList.add('in'));
  setTimeout(() => { t.classList.remove('in'); setTimeout(() => t.remove(), 300); }, kind === 'err' ? 6000 : 3200);
  if (kind === 'err') log(msg);
}

// Tiny event bus
// Animations follow the system's reduce-motion setting and the app's own Animations switch.
const motionOff = () => document.body.classList.contains('nomotion') || matchMedia('(prefers-reduced-motion: reduce)').matches;
const bus = { on(e, f) { (this[e] ||= []).push(f); }, emit(e, ...a) { (this[e] || []).forEach(f => f(...a)); } };

// Original line icons (24px grid, stroke-based)
const ICON = {
  sidebar: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>',
  camera: '<rect x="2.5" y="6" width="13" height="12" rx="3"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/>',
  speaker: '<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/>',
  sliders: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  wand: '<path d="M4 20L15 9M14 4v3M18.5 5.5l-2 2M20 10h-3M9.5 4.5l1.5 1.5"/>',
  folder: '<path d="M3 7.5a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',

// LUT library: parse .cube files and keep them in IndexedDB.
const luts = new Map();   // name -> { name, size, data: Float32Array, dmin, dmax }

function parseCube(text, fileName) {
  let size = 0, dmin = [0, 0, 0], dmax = [1, 1, 1], title = '';
  const vals = [];
  for (let line of text.split(/\r?\n/)) {
    line = line.trim();
    if (!line || line[0] === '#') continue;
    const p = line.split(/\s+/), k = p[0].toUpperCase();
    if (k === 'TITLE') title = line.slice(5).trim().replace(/^"|"$/g, '');
    else if (k === 'LUT_3D_SIZE') size = parseInt(p[1]);
    else if (k === 'LUT_1D_SIZE') throw new Error('1D LUTs are not supported. Use a 3D .cube LUT.');
    else if (k === 'DOMAIN_MIN') dmin = p.slice(1, 4).map(Number);
    else if (k === 'DOMAIN_MAX') dmax = p.slice(1, 4).map(Number);
    else if (/^[-+.\d]/.test(p[0]) && p.length >= 3) vals.push(+p[0], +p[1], +p[2]);
  }
  if (!size) throw new Error('No LUT_3D_SIZE found');
  if (vals.length !== size ** 3 * 3) throw new Error(`Expected ${size ** 3} entries, found ${vals.length / 3}`);
  return { name: fileName.replace(/\.cube$/i, '') || title || 'LUT', size, data: new Float32Array(vals), dmin, dmax };
}

async function loadLuts() {
  const all = await idbAll('luts') || [];
  all.forEach(l => luts.set(l.name, l));
  bus.emit('luts');
}
async function importLuts(files) {
  let last = null;
  for (const f of files) {
    if (!/\.cube$/i.test(f.name)) { toast(`${f.name}: only .cube LUTs are supported`, 'err'); continue; }
    try {
      const l = parseCube(await f.text(), f.name);
      luts.set(l.name, l); await idbPut('luts', l.name, l);
      log(`Imported LUT ${l.name} (${l.size}³)`); last = l.name;
    } catch (e) { toast(`${f.name}: ${e.message}`, 'err'); }
  }
  bus.emit('luts');
  return last;
}
async function deleteLut(name) { luts.delete(name); await idbDel('luts', name); bus.emit('luts'); }

const WORKLET = `

const RES = { '2160': { w: 3840, h: 2160, l: '4K' }, '1080': { w: 1920, h: 1080, l: '1080p' }, '720': { w: 1280, h: 720, l: '720p' } };

// One-click setup: every camera at its best mode, sensible audio inputs with matched presets.
async function autoSetup() {
  await refreshDevices();
  cams.filter(c => !c.kind || c.kind === 'device').forEach(removeCam);
  audio.channels.filter(c => c.kind === 'device').forEach(c => audio.remove(c));
  const real = videoDevices.filter(d => !/virtual|obs|snap camera|xsplit|gadget cam studio/i.test(d.label));
  const list = real.length ? real : videoDevices;
  for (const d of list.slice(0, 6)) {
    const mem = recallDevice(d.label);
    const cam = newCam({ ...mem, deviceId: d.deviceId, label: d.label, name: mem.name || prettyCamName(d.label, cams.length + 1) });
    await openCam(cam);
    if (cam.alive && cam.actual && cam.actual.h < RES[cam.res].h) {
      cam.res = cam.actual.h >= 1080 ? '1080' : '720';        // camera can't do what we asked; settle on what it can
    }
  }

  if (perf.level().state === 'over') {
    for (const c of cams) if (c.res === '2160') { c.res = '1080'; await openCam(c); }
    for (const c of cams) if (perf.level().state === 'over' && c.fps > 30) { c.fps = 30; await openCam(c); }
    for (const c of cams.slice().reverse()) if (perf.level().state === 'over' && c.res === '1080') { c.res = '720'; await openCam(c); }
    const lv = perf.level();
    toast(lv.state === 'over' ? `${cams.length} cameras is more than this computer can comfortably record (${lv.pct}%). Consider removing one.` : `Lowered camera settings to fit this computer (${lv.pct}% load)`, lv.state === 'over' ? 'err' : '');
  }

  const picks = [];
  const pro = audioDevices.filter(d => d.deviceId !== 'default' && /lark|wireless|studiolive|presonus|scarlett|focusrite|motu|interface|rode|shure|dji/i.test(d.label));
  if (pro.length) picks.push(...pro.slice(0, 3));
  else if (def) picks.push(audioDevices.find(d => d.deviceId !== 'default' && d.groupId === def.groupId) || def);
  else if (audioDevices[0]) picks.push(audioDevices[0]);
  for (const d of picks) await audio.addChannel({ kind: 'device', deviceId: d.deviceId, label: d.label, name: shortName(d.label) || 'Mic', s: withPreset(guessPreset(d.label)) });
  bus.emit('cams'); bus.emit('audio');
  log(`Auto setup: ${cams.length} camera(s), ${audio.channels.length} audio input(s)`);

  const l = shortName(label);

  return l ? l.replace(/\s*(webcam|camera)\s*/i, ' ').trim().slice(0, 20) || `Camera ${n}` : `Camera ${n}`;
}

        <sequence format="${seqFmt}" duration="${T(dur)}" tcStart="0s" tcFormat="NDF" audioLayout="stereo" audioRate="48k">

            <gap name="Gadget Cam Studio" offset="0s" start="0s" duration="${T(dur)}">
${assets.map((a, i) => `              <asset-clip ref="${a.id}" lane="${i + 1}" offset="${T(a.s.offset)}" name="${xmlEsc(a.s.cam.name)}" start="0s" duration="${T(a.len)}" format="${a.f}" tcFormat="NDF"/>`).join('\n')}
${wavs.map((a, i) => `              <asset-clip ref="${a.id}" lane="-${i + 1}" offset="${T(a.s.offset + Math.max(-a.lead, 0))}" name="${xmlEsc(a.s.ch.name)}" start="${T(Math.max(a.lead, 0))}" duration="${T(a.len)}"/>`).join('\n')}
${recState.markers.map(m => `              <marker start="${T(m.t)}" duration="1/${fps}s" value="${xmlEsc(m.name)}"/>`).join('\n')}
            </gap>
          </spine>
        </sequence>
      </project>
    </event>
  </library>
</fcpxml>
`;
  const base = `${safeName(project.name)}_T${recState.take}`;
  await writeText(`${base}_Resolve.fcpxml`, xml);
  if (recState.markers.length) {
    const edl = `TITLE: ${title}\nFCM: NON-DROP FRAME\n\n` + recState.markers.map((m, i) =>
      `${String(i + 1).padStart(3, '0')}  001      V     C        ${tc(m.t, fps)} ${tc(m.t + 1 / fps, fps)} ${tc(m.t, fps)} ${tc(m.t + 1 / fps, fps)}  \n |C:ResolveColorBlue |M:${m.name} |D:1\n`).join('\n');
    await writeText(`${base}_markers.edl`, edl);
    await writeText(`${base}_markers.csv`, 'Marker,Timecode,Seconds\n' + recState.markers.map(m => `"${m.name}",${tc(m.t, fps)},${m.t.toFixed(3)}`).join('\n') + '\n');
  }
  if (recState.markers.length && project.chapters) await writeText(`${base}_YouTube_chapters.txt`, youtubeChapters());
  log(`Exported ${base}_Resolve.fcpxml${recState.markers.length ? ' and markers' : ''}`);
}

// ---------- YouTube chapters from markers ----------
const ytTime = sec => { sec = Math.floor(sec); const h = sec / 3600 | 0, m = (sec / 60 | 0) % 60, s = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
function youtubeChapters() {
  const list = [{ t: 0, name: recState.introName || 'Intro' }, ...recState.markers.filter(m => m.t >= 10)];
  return list.map(m => `${ytTime(m.t)} ${m.name}`).join('\n') + '\n';
}
// Right after a take with markers: name them once, and they flow into Resolve, the CSV and YouTube chapters.
function nameMarkers() {
  return new Promise(resolve => {
    let done = false; const finish = () => { if (done) return; done = true; clearTimeout(timer); try { dlg.close(); } catch {} resolve(); };
    const rows = recState.markers.map((m, i) => `<div class="r chap"><span class="tc">${ytTime(m.t)}</span><input data-i="${i}" value="${esc(m.name)}" maxlength="60" spellcheck="true"></div>`).join('');
    const dlg = h(`<dialog class="chapdlg"><div class="dh"><b>Name your chapters</b><button class="btn primary" data-act="ok">Save</button></div>
      <div class="db"><div class="group"><div class="r chap"><span class="tc">0:00</span><input data-intro value="${esc(recState.introName || 'Intro')}" maxlength="60"></div>${rows}</div>
      <div class="note keep">These names go into your Resolve markers and a YouTube chapters file you can paste into the description.${recState.markers.some(m => m.t < 10) ? ' Markers in the first 10 seconds are left out of YouTube chapters.' : ''}</div></div></dialog>`);
    document.body.appendChild(dlg); dlg.showModal();
    const first = dlg.querySelector('input[data-i]'); if (first) { first.focus(); first.select(); }
    dlg.querySelector('[data-act=ok]').onclick = () => {
      dlg.querySelectorAll('input[data-i]').forEach(inp => { const v = inp.value.trim(); if (v) recState.markers[+inp.dataset.i].name = v; });
      recState.introName = dlg.querySelector('[data-intro]').value.trim() || 'Intro';
      finish();
    };
    dlg.addEventListener('keydown', e => { if (e.key === 'Enter') dlg.querySelector('[data-act=ok]').click(); });
    dlg.addEventListener('close', () => { finish(); setTimeout(() => dlg.remove(), 400); });
    const timer = setTimeout(finish, 180000);              // never hold up saving for more than 3 minutes
  });
}

// ---------- health ----------
function recHealth() {
  const el = recState.active ? (performance.now() - recState.start) / 1000 : 0;
  const bytes = recState.segments.reduce((a, s) => a + s.bytes, 0);
  const live = recState.segments.filter(s => s.end == null).length;
  const perSec = el > 3 ? bytes / el : (cams.filter(c => c.alive).length * project.bitrate / 8) + cams.filter(c => c.alive && c.vert.on).length * project.bitrate * 0.6 / 8;
  return { elapsed: el, bytes, perHour: perSec * 3600, perSec, liveFiles: live };
}

// ---- 06-ui-kit.js ----
// UI kit: inspector controls (sliders, switches, menus, segmented controls) + one binder for all of them.
// Plain-text descriptions become hover tooltips; only live info (HTML like file previews) stays on screen.
const tipOnly = sub => sub && !/[<]/.test(sub);
const subHtml = sub => sub && !tipOnly(sub) ? `<small>${sub}</small>` : '';
const tipAttr = sub => tipOnly(sub) ? ` title="${esc(sub)}"` : '';
const ui = {
  slider(k, label, min, max, step, val, dflt = 0, fmt = v => v, opts = {}) {
    const center = min < 0 && max > 0;
    const p = ((val - min) / (max - min) * 100).toFixed(2);
    return `<div class="sl ${val !== dflt ? 'changed' : ''} ${opts.cls || ''}" data-wrap="${k}">
      <div class="top"><span>${label}</span><output>${esc(fmt(val))}</output></div>
      <input type="range" class="s ${center ? 'center' : ''}" data-k="${k}" data-d="${dflt}" min="${min}" max="${max}" step="${step}" value="${val}" style="--p:${p}%"></div>`;
  },
  toggle(k, label, val, sub = '') {
    return `<div class="r"${tipAttr(sub)}><div class="lb">${label}${subHtml(sub)}</div>
      <label class="sw"><input type="checkbox" data-k="${k}" ${val ? 'checked' : ''}><i></i></label></div>`;
  },
  select(k, label, options, val, sub = '') {
    return `<div class="r"${tipAttr(sub)}><div class="lb">${label}${subHtml(sub)}</div>
      <select data-k="${k}">${options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
  },
  seg(k, options, val, cls = '') {
    return `<div class="seg ${cls}" data-seg="${k}">${options.map(([v, l]) => `<button data-v="${esc(v)}" class="${String(v) === String(val) ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  },
  row(label, html, sub = '') { return `<div class="r"${tipAttr(sub)}><div class="lb">${label}${subHtml(sub)}</div>${html}</div>`; },
  group(title, inner, action = '') { return `<div class="group-h"><span>${title}</span>${action}</div><div class="group">${inner}</div>`; },
};

// Bind every [data-k] / [data-seg] inside root to obj. onChange(key, value) runs after each change.
function bindControls(root, obj, onChange) {
  root.querySelectorAll('input[type=range][data-k]').forEach(inp => {
    const k = inp.dataset.k, wrap = inp.closest('.sl'), out = wrap && wrap.querySelector('output');
    const fmt = inp._fmt || (v => v);
    const paint = () => {
      const v = +inp.value;
      inp.style.setProperty('--p', ((v - inp.min) / (inp.max - inp.min) * 100) + '%');
      if (out) out.textContent = (inp._fmt || fmt)(v);
      if (wrap) wrap.classList.toggle('changed', v !== +inp.dataset.d);
    };
    inp.addEventListener('input', () => { obj[k] = +inp.value; paint(); onChange(k, obj[k]); });
    inp.addEventListener('dblclick', () => { inp.value = inp.dataset.d; obj[k] = +inp.value; paint(); onChange(k, obj[k]); });
    inp._paint = paint;
  });
  root.querySelectorAll('input[type=checkbox][data-k]').forEach(inp => inp.addEventListener('change', () => { obj[inp.dataset.k] = inp.checked; onChange(inp.dataset.k, inp.checked); }));
  root.querySelectorAll('select[data-k], input[type=color][data-k], input[type=text][data-k], input[type=number][data-k]').forEach(inp => {
    inp.addEventListener(inp.type === 'color' ? 'input' : 'change', () => {
      const raw = inp.value, v = inp.type === 'number' || (/^-?\d+(\.\d+)?$/.test(raw) && typeof obj[inp.dataset.k] === 'number') ? +raw : raw;
      obj[inp.dataset.k] = v; onChange(inp.dataset.k, v);
    });
  });
  root.querySelectorAll('[data-seg]').forEach(seg => seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const k = seg.dataset.seg, cur = obj[k];
    const v = typeof cur === 'number' ? +b.dataset.v : typeof cur === 'boolean' ? b.dataset.v === 'true' : b.dataset.v;
    seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    obj[k] = v; onChange(k, v);
  })));
}
// attach value formatters to sliders after binding html is in the DOM
function setFmt(root, k, fmt) { const i = root.querySelector(`input[data-k="${k}"]`); if (i) { i._fmt = fmt; i._paint && i._paint(); } }

const signed = v => (v > 0 ? '+' : '') + v;
const pct = v => v + '%';

function openMenu(title, html, bindFn) {
  const d = $('#menu'); $('#menuTitle').textContent = title; $('#menuBody').innerHTML = html;
  bindFn && bindFn($('#menuBody'), d);
  if (!d.open) d.showModal();

}

let inspTab = store.get('inspTab', 'look');
const STATUS_TEXT = { idle: ['No camera selected', 'Pick a device in the inspector.'], opening: ['Opening…', ''],
  lost: ['Disconnected', 'Plug it back in and it reconnects on its own.'], busy: ['Camera in use', 'Close other apps using it (like OBS or Camo Studio preview), then click to retry.'],
  error: ['Could not open camera', ''] };

function select(type, obj) { selected = obj ? { type, obj } : null; bus.emit('select'); }

// ---------- tiles ----------
function tileFor(cam) {
  if (cam.tile) return cam.tile;
  const t = h(`<div class="tile">
    <div class="ov tl"><span class="chip-o nm" title="Click to rename"></span></div>
    <div class="ov tr"><span class="chip-o green pg" hidden>OUTPUT</span><span class="chip-o red rc" hidden>● REC</span><span class="chip-o warn fpsw" hidden></span><span class="chip-o blue lutc" hidden></span></div>
    <div class="ov bl"><span class="chip-o mono info"></span></div>
    <div class="ov br"><button class="chip-o mplay" hidden title="Play or pause the clip">${icon('play', 'sm')}</button><button class="chip-o toout" title="Send this camera to the output (virtual camera)">${icon('camera', 'sm')} Output</button><button class="chip-o cmp" title="Hold to see the original">${icon('compare', 'sm')} Original</button></div>
    <div class="vguide" hidden></div>
    <div class="msg"></div></div>`);
  t.prepend(cam.canvas);
  t.addEventListener('pointerdown', e => { if (e.target.closest('.cmp,.toout')) return; if (view.mode === 'output') { setProgramCam(cam); applyView(); } select('cam', cam); });
  t.querySelector('.toout').addEventListener('click', e => { e.stopPropagation(); setProgramCam(cam); });
  t.querySelector('.mplay').addEventListener('click', e => { e.stopPropagation(); const v = cam.video; if (v.paused) { v.play(); startLoop(cam); } else v.pause(); setTimeout(() => paintTile(cam), 50); });
  t.querySelector('.nm').addEventListener('click', e => { if (t.classList.contains('thumb')) return; e.stopPropagation(); inlineRename(cam); });
  const cmp = t.querySelector('.cmp');
  const hold = on => { if (recState.active && !cam.recR) return; cam.comparing = on; };
  cmp.addEventListener('pointerdown', e => { e.stopPropagation(); hold(true); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => cmp.addEventListener(ev, () => hold(false)));
  t.querySelector('.msg').addEventListener('click', () => {
    if (['busy', 'error'].includes(cam.status)) openCam(cam);
    else if (cam.status === 'lost' && cam.kind === 'media') addVideoSource(cam);
    else if (cam.status === 'lost' && cam.kind === 'screen') addScreenSource(cam);
    else if (cam.status === 'lost' && cam.kind === 'image') addImageSource(cam);
    else if (cam.status === 'lost' && cam.kind === 'phone') openPhonePairing();
  });
  // drag to reposition when zoomed in
  let drag = null;
  cam.canvas.addEventListener('pointerdown', e => {
    if (cam.adj.zoom <= 100) return;
    drag = { x: e.clientX, y: e.clientY, px: cam.adj.panX, py: cam.adj.panY, w: cam.canvas.clientWidth, h: cam.canvas.clientHeight };
    cam.canvas.setPointerCapture(e.pointerId);
  });
  cam.canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const z = cam.adj.zoom / 100, k = 2 / (z - 1) * 100;
    cam.adj.panX = clamp(Math.round(drag.px - (e.clientX - drag.x) / drag.w * k), -100, 100);
    cam.adj.panY = clamp(Math.round(drag.py - (e.clientY - drag.y) / drag.h * k), -100, 100);
  });
  cam.canvas.addEventListener('pointerup', () => { if (drag) { drag = null; saveCurrent(); if (isSel(cam)) renderInspector(); } });
  // drop a LUT or a background image
  t.addEventListener('dragover', e => { e.preventDefault(); t.classList.add('drop'); });
  t.addEventListener('dragleave', () => t.classList.remove('drop'));
  t.addEventListener('drop', async e => {
    e.preventDefault(); e.stopPropagation(); t.classList.remove('drop');
    const files = [...e.dataTransfer.files];
    const img = files.find(f => f.type.startsWith('image/'));
    if (img) { await setCamBg(cam, img); cam.adj.key = true; toast(`Background set for ${cam.name}`); }
    const name = await importLuts(files.filter(f => /\.cube$/i.test(f.name)));
    if (name) { cam.lut.name = name; syncRenderers(cam); toast(`${name} applied to ${cam.name}`); }
    saveCurrent(); select('cam', cam);
  });
  cam.tile = t;
  return t;
}

function paintTile(cam) {
  const t = tileFor(cam);
  t.classList.toggle('sel', isSel(cam));
  t.classList.toggle('rec', recState.active && recState.segments.some(s => s.cam === cam && s.end == null));
  t.classList.toggle('grab', cam.adj.zoom > 100);
  const nmEl = t.querySelector('.nm'); if (!nmEl.querySelector('input')) nmEl.textContent = cam.name;
  t.querySelector('.rc').hidden = !t.classList.contains('rec');
  const mp = t.querySelector('.mplay'); mp.hidden = cam.kind !== 'media' || !cam.alive; if (!mp.hidden) mp.innerHTML = icon(cam.video.paused ? 'play' : 'pause', 'sm');
  t.querySelector('.pg').hidden = !(typeof progCam === 'function' && progCam() === cam && (vcamState.on || (outWin && !outWin.closed)));
  t.querySelector('.toout').hidden = typeof progCam === 'function' && progCam() === cam;
  const info = t.querySelector('.info');
  info.textContent = cam.alive && cam.actual ? `${cam.actual.w}×${cam.actual.h} · ${cam.health.fps || cam.actual.fps} fps${cam.vert.on ? ' · +9:16' : ''}` : '';
  info.parentElement.hidden = !cam.alive;
  const fw = t.querySelector('.fpsw'); fw.hidden = !(cam.alive && cam.health.low); fw.textContent = `${cam.health.fps} fps`;
  const lc = t.querySelector('.lutc'); lc.hidden = !cam.lut.name; lc.textContent = (cam.lut.bake ? 'LUT · rec ' : 'LUT · view ') ;
  const msg = t.querySelector('.msg');
  const LOST = { media: ['Video not loaded', 'Click to choose the video file again.'], screen: ['Not sharing', 'Click to share a screen or app again.'], image: ['Image missing', 'Click to choose an image.'], phone: ['Waiting for the phone', 'Open the camera page on the phone, or click to show the QR code.'] };
  const st = cam.status === 'lost' && LOST[cam.kind] ? LOST[cam.kind] : STATUS_TEXT[cam.status];
  msg.hidden = cam.status === 'live';
  if (st) msg.innerHTML = `<div><b>${st[0]}</b>${esc(cam.status === 'error' ? cam.error : st[1])}</div>`;
  const g = t.querySelector('.vguide');
  g.hidden = !cam.vert.on || !cam.alive;
  if (cam.vert.on && cam.actual) {
    const swap = (cam.adj.rot / 90) % 2 === 1, W = swap ? cam.actual.h : cam.actual.w, H = swap ? cam.actual.w : cam.actual.h;
    const cw = Math.min(1, (9 / 16) / (W / H)), left = clamp((1 - cw) / 2 + cam.vert.x / 100 * (1 - cw) / 2, 0, 1 - cw);
    g.style.cssText = `position:absolute;top:0;bottom:0;left:${left * 100}%;width:${cw * 100}%;box-shadow:0 0 0 9999px rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.8);pointer-events:none;border-radius:2px`;
  }
}

function camLookTab(b, cam) {

  const desc = LOOKS[a.look] ? LOOKS[a.look].desc : mine[a.look] ? 'Your saved look.' : 'Your own adjustments.';
  const card = (n, d, isMine) => `<button class="card ${a.look === n ? 'on' : ''}" data-look="${esc(n)}" title="${esc(d)}"><b>${esc(n)}</b><span>${esc(d)}</span>${isMine ? `<i class="del" data-del="1" title="Delete">${icon('x', 'sm')}</i>` : ''}</button>`;
  const lutOpts = [['', 'None'], ...[...luts.keys()].sort().map(n => [n, n]), ['__import', 'Import .cube…']];
  b.innerHTML = `
    <div class="now"><div><b>${esc(a.look)}${a.lookEdited ? '<em>EDITED</em>' : ''}</b><span>${esc(desc)}</span></div></div>
    <div class="cards">${Object.entries(LOOKS).map(([n, l]) => card(n, l.desc)).join('')}</div>
    <div class="cat">My looks</div>
    <div class="cards">${Object.keys(mine).map(n => card(n, 'Saved look', true)).join('') || '<div class="empty-note" style="grid-column:1/-1">None yet</div>'}</div>
    <div class="savebar"><input placeholder="Name this look" maxlength="28"><button class="btn primary">Save</button></div>
    ${ui.group('LUT', `
      ${ui.select('name', 'LUT', lutOpts, cam.lut.name)}
      ${ui.slider('amt', 'Strength', 0, 100, 1, Math.round(cam.lut.amt * 100), 100, pct)}
      ${ui.toggle('bake', 'Record with LUT', cam.lut.bake, 'Off keeps your file clean (S-Log) for grading. On burns the LUT into the recording.')}`,
      `<button data-act="luts">Manage</button>`)}
    <div class="btns"><button class="btn" data-act="copy">${icon('copy', 'sm')} Copy look to all cameras</button><button class="btn danger" data-act="reset">Reset all</button></div>`;
  b.querySelectorAll('[data-look]').forEach(c => c.onclick = e => {
    const n = c.dataset.look;
    if (e.target.closest('[data-del]')) { const m = store.get('userLooks', {}); delete m[n]; store.set('userLooks', m); return renderInspector(); }
    const vals = LOOKS[n] ? LOOKS[n].a : mine[n];
    Object.assign(a, vals, { look: n, lookEdited: false });
    paintTile(cam); saveCurrent(); renderInspector(); checkLoad();
  });
  const nameIn = b.querySelector('.savebar input');
  const saveLook = () => {
    const n = nameIn.value.trim(); if (!n) return nameIn.focus();
    if (LOOKS[n]) return toast('That name belongs to a built-in look', 'err');
    const m = store.get('userLooks', {}); m[n] = Object.fromEntries(LOOK_KEYS.map(k => [k, a[k]])); store.set('userLooks', m);
    a.look = n; a.lookEdited = false; saveCurrent(); renderInspector(); toast(`Saved look “${n}”`);
  };
  b.querySelector('.savebar button').onclick = saveLook;
  nameIn.onkeydown = e => { if (e.key === 'Enter') saveLook(); };
  const lutObj = { name: cam.lut.name, amt: Math.round(cam.lut.amt * 100), bake: cam.lut.bake };
  bindControls(b.querySelector('.group'), lutObj, async (k, v) => {
    if (k === 'name' && v === '__import') { const n = await pickLut(); lutObj.name = n || cam.lut.name; if (n) cam.lut.name = n; syncRenderers(cam); return renderInspector(); }
    if (k === 'name') { cam.lut.name = v; syncRenderers(cam); }
    if (k === 'amt') cam.lut.amt = v / 100;
    if (k === 'bake') cam.lut.bake = v;
    paintTile(cam); saveCurrentSoon(); checkLoad();
  });
  b.querySelector('[data-act=luts]').onclick = manageLuts;
  b.querySelector('[data-act=copy]').onclick = () => {
    cams.filter(c => c !== cam).forEach(c => { LOOK_KEYS.forEach(k => c.adj[k] = a[k]); c.adj.look = a.look; c.adj.lookEdited = a.lookEdited; c.lut = { ...cam.lut }; syncRenderers(c); paintTile(c); });
    saveCurrent(); toast('Look copied to every camera');
  };
  b.querySelector('[data-act=reset]').onclick = () => {
    Object.assign(cam.adj, { ...ADJ_DEFAULT, bgKey: cam.adj.bgKey }); cam.lut = { name: '', amt: 1, bake: false }; syncRenderers(cam);
    paintTile(cam); saveCurrent(); renderInspector();
  };
}

// Audio UI: mixer dock strips, sidebar list, channel inspector (presets, EQ curve, FX), master inspector, sound check.
const BANDS = [['ls', 'Low', 30, 400, false], ['lm', 'Low-mid', 100, 1000, true], ['md', 'Mid', 300, 3000, true], ['pr', 'Presence', 1500, 10000, true], ['hs', 'Air', 3000, 16000, false]];
const hz = v => v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + ' kHz' : Math.round(v) + ' Hz';
const dB = v => (v > 0 ? '+' : '') + v + ' dB';
let eqAdv = store.get('eqAdv', false);

function faderHtml(cls, label, val) {
  return `<div class="fcol"><span class="v ${cls}">${fmtDb(sliderDb(val))}</span><input type="range" class="vf ${cls}" min="0" max="100" step="0.5" value="${val}" title="${label}"></div>`;
}
function wireFader(root, cls, get, set, after) {
  const f = root.querySelector('input.vf.' + cls), v = root.querySelector('.v.' + cls);
  const upd = val => { set(val); v.textContent = fmtDb(sliderDb(val)); after(cls, val); };
  f.addEventListener('input', () => upd(+f.value));
  f.addEventListener('dblclick', () => { f.value = 91; upd(91); });
  f.addEventListener('pointerdown', e => e.stopPropagation());
}

function renderStrips() {
  const host = $('#strips'); host.innerHTML = '';
  for (const ch of audio.channels) {
    const s = ch.s;
    const el = h(`<div class="strip ${isSel(ch) ? 'sel' : ''} ${ch.alive ? '' : 'dead'}">
      <div class="nm">${esc(ch.name)}</div><div class="pz"><button class="role r-${roleOf(ch)}" title="Role (click to change): sets its level in mix presets and whether it ducks">${ROLES.find(r => r[0] === roleOf(ch))[1]}</button> ${esc(s.preset || 'Custom')}${s.presetEdited ? ' ·' : ''}</div>
      <div class="body"><div class="vm"><i></i><b></b></div>${audio.aiActive(ch) ? '<span class="aibadge strip-ai" title="AI voice cleanup is on">AI</span>' : ''}${faderHtml('rec', 'REC', s.rec)}${faderHtml('mon', 'MON', s.mon)}</div>
      <div class="row"><button class="mute rm ${s.recMute ? 'on' : ''}" title="Mute in recording">REC</button><button class="mute mm ${s.monMute ? 'on' : ''}" title="Mute in headphones">MON</button><button class="lk ${s.link ? 'on' : ''}" title="Move both faders together">LINK</button></div></div>`);
    ch.meterEl = el.querySelector('.vm');
    el.onclick = e => { if (!e.target.closest('button,input')) select('audio', ch); };
    el.querySelector('.role').onclick = e => { e.stopPropagation(); cycleRole(ch); };
    const after = (cls, val) => {
      if (s.link) { const o = cls === 'rec' ? 'mon' : 'rec'; s[o] = val; el.querySelector('input.vf.' + o).value = val; el.querySelector('.v.' + o).textContent = fmtDb(sliderDb(val)); }
      audio.apply(ch); saveCurrentSoon();
    };
    wireFader(el, 'rec', () => s.rec, v => s.rec = v, after);
    wireFader(el, 'mon', () => s.mon, v => s.mon = v, after);
    el.querySelector('.rm').onclick = e => { s.recMute = !s.recMute; e.currentTarget.classList.toggle('on', s.recMute); audio.apply(ch); saveCurrentSoon(); };
    el.querySelector('.mm').onclick = e => { s.monMute = !s.monMute; e.currentTarget.classList.toggle('on', s.monMute); audio.apply(ch); saveCurrentSoon(); };
    el.querySelector('.lk').onclick = e => { s.link = !s.link; e.currentTarget.classList.toggle('on', s.link); saveCurrentSoon(); };
    host.appendChild(el);
  }
  if (!audio.channels.length) host.appendChild(h(`<div class="empty-note" style="align-self:center;padding:30px 10px">No audio inputs. Click “Add input”.</div>`));
  const m = audio.master;
  const rec = h(`<div class="strip master ${selected && selected.type === 'master' ? 'sel' : ''}" style="margin-left:auto">
      <div class="nm">Record mix</div><div class="pz" id="cgText">Clipguard ${m.clipguard ? 'on' : 'off'}</div>
      <div class="body"><div class="vm"><i></i><b></b></div>${faderHtml('rec', 'REC', m.rec)}</div>
      <div class="row"><button class="mute ${m.recMute ? 'on' : ''}">MUTE</button></div></div>`);
  const mon = h(`<div class="strip master ${selected && selected.type === 'master' ? 'sel' : ''}">
      <div class="nm">Headphones</div><div class="pz">${m.monMute ? 'Muted' : 'Monitor mix'}</div>
      <div class="body"><div class="vm"><i></i><b></b></div>${faderHtml('mon', 'MON', m.mon)}</div>
      <div class="row"><button class="mute ${m.monMute ? 'on' : ''}">MUTE</button></div></div>`);
  audio.recMeterEl = rec.querySelector('.vm'); audio.monMeterEl = mon.querySelector('.vm');
  const mAfter = () => { audio.applyMaster(); saveCurrentSoon(); };
  wireFader(rec, 'rec', () => m.rec, v => m.rec = v, mAfter);
  wireFader(mon, 'mon', () => m.mon, v => m.mon = v, mAfter);
  rec.querySelector('.mute').onclick = e => { m.recMute = !m.recMute; e.currentTarget.classList.toggle('on', m.recMute); mAfter(); };
  mon.querySelector('.mute').onclick = e => { m.monMute = !m.monMute; e.currentTarget.classList.toggle('on', m.monMute); mon.querySelector('.pz').textContent = m.monMute ? 'Muted' : 'Monitor mix'; mAfter(); };
  [rec, mon].forEach(x => x.onclick = e => { if (!e.target.closest('button,input')) select('master', audio.master); });
  host.append(rec, mon);
}

// live meters
const meterHold = new WeakMap();
function paintMeter(el, db) {
  if (!el) return;
  const p = clamp((db + 60) / 60 * 100, 0, 100), st = meterHold.get(el) || { hold: 0 };
  st.hold = st.hold > p ? st.hold - 0.5 : p; meterHold.set(el, st);
  el.firstChild.style.height = p + '%'; el.lastChild.style.bottom = st.hold + '%';
}
(function meterLoop() {
  if (audio.recAn) {
    audio.channels.forEach(ch => ch.n && paintMeter(ch.meterEl, audio.peakOf(ch.n.an)));
    paintMeter(audio.recMeterEl, audio.peakOf(audio.recAn)); paintMeter(audio.monMeterEl, audio.peakOf(audio.monAn));
    const cg = $('#cgText');
    if (cg) { const r = audio.cg; cg.textContent = !audio.master.clipguard ? 'Clipguard off' : r > 0.02 ? `Clipguard −${(-20 * Math.log10(1 - r)).toFixed(1)} dB` : 'Clipguard on'; cg.style.color = audio.master.clipguard && r > 0.02 ? 'var(--warn)' : ''; }
  }
  requestAnimationFrame(meterLoop);
})();

function addAudioMenu() {
  const used = new Set(audio.channels.map(c => c.deviceId));
  const devs = audioDevices.filter(d => d.deviceId !== 'default' && !used.has(d.deviceId));
  openMenu('Add audio input',
    devs.map(d => `<div class="item" data-id="${esc(d.deviceId)}">${icon('mic', 'sm')}<span class="grow">${esc(shortName(d.label) || 'Microphone')}<div class="sub">Preset: ${esc(guessPreset(d.label))}</div></span></div>`).join('') +
    `<div class="item" data-sys="1">${icon('speaker', 'sm')}<span class="grow">System audio<div class="sub">Games, browser, music${NATIVE ? '' : ' (Chrome asks to share your screen)'}</div></span></div>`,
    (body, dlg) => body.querySelectorAll('.item').forEach(el => el.onclick = async () => {
      dlg.close();
      let ch;
      if (el.dataset.sys) ch = await audio.addSystemAudio();
      else { const d = audioDevices.find(x => x.deviceId === el.dataset.id); ch = await audio.addChannel({ kind: 'device', deviceId: d.deviceId, label: d.label, name: shortName(d.label) || 'Mic', s: withPreset(guessPreset(d.label)) }); }
      if (ch) { select('audio', ch); saveCurrent(); }
    }));
}

async function runSoundCheck() {
  if (!audio.channels.length) return toast('Add an audio input first', 'err');
  if (recState.active) return toast('Stop recording first', 'err');
  const btn = $('#soundCheck'); btn.disabled = true;
  toast('Sound check: talk normally for 5 seconds…');
  const res = await audio.soundCheck(5, left => { btn.textContent = `Listening… ${Math.ceil(left)}`; });
  btn.disabled = false; btn.innerHTML = `${icon('wave', 'sm')} Sound check`;
  const done = res.filter(r => !r.skipped);
  toast(done.length ? 'Levels set: ' + done.map(r => `${r.name} ${dB(r.gain)}`).join(', ') : 'No sound heard. Check your inputs.', done.length ? '' : 'err');
  saveCurrent(); renderInspector();
}

// ---------- channel inspector ----------
// EQ view: the curve glides to new settings, with the live voice behind it (grey = what comes in, color = what you hear).
const eqView = { ch: null, cur: null, tgt: null, run: false, bins: null, binsIn: null, pulse: 0 };
function eqTarget(ch) {
  const N = 240, f = new Float32Array(N); for (let i = 0; i < N; i++) f[i] = 20 * Math.pow(1000, i / (N - 1));
  const mag = new Float32Array(N).fill(1), m = new Float32Array(N), ph = new Float32Array(N);
  for (const k of ['hpf', 'ls', 'lm', 'md', 'pr', 'hs']) { ch.n[k].getFrequencyResponse(f, m, ph); for (let i = 0; i < N; i++) mag[i] *= m[i]; }
  return Float32Array.from(mag, v => clamp(20 * Math.log10(v || 1e-6), -18, 18));
}
function drawEq(ch) {
  if (!ch || !ch.n) return;
  const tgt = eqTarget(ch);
  if (eqView.ch !== ch || !eqView.cur || motionOff()) eqView.cur = Float32Array.from(tgt);
  eqView.ch = ch; eqView.tgt = tgt; eqView.pulse = 1;
  if (!eqView.run) { eqView.run = true; requestAnimationFrame(eqFrame); }
}
function eqFrame() {
  const ch = eqView.ch, cv = $('#insp .eqc');
  if (!cv || !ch || !ch.n || !isSel(ch)) { eqView.run = false; eqView.ch = null; return; }
  const cs = getComputedStyle(document.documentElement), col = n => cs.getPropertyValue(n).trim();
  const x = cv.getContext('2d'), W = cv.width, H = cv.height, R = 18, N = eqView.cur.length;
  const X = v => Math.log(v / 20) / Math.log(1000) * W, Y = d => H / 2 - d / R * (H / 2 - 10);
  for (let i = 0; i < N; i++) eqView.cur[i] += (eqView.tgt[i] - eqView.cur[i]) * 0.22;
  eqView.pulse *= 0.9;
  x.clearRect(0, 0, W, H);
  x.strokeStyle = col('--line'); x.lineWidth = 1.5;
  for (const g of [50, 100, 200, 500, 1000, 2000, 5000, 10000]) { x.beginPath(); x.moveTo(X(g), 0); x.lineTo(X(g), H); x.stroke(); }
  for (const g of [-12, -6, 6, 12]) { x.beginPath(); x.moveTo(0, Y(g)); x.lineTo(W, Y(g)); x.stroke(); }
  x.strokeStyle = col('--line2'); x.beginPath(); x.moveTo(0, Y(0)); x.lineTo(W, Y(0)); x.stroke();
  const acc = col('--accent');
  // live spectrum
  const spec = (an, key) => {
    if (!an) return null;
    const b = eqView[key] && eqView[key].length === an.frequencyBinCount ? eqView[key] : (eqView[key] = new Float32Array(an.frequencyBinCount));
    an.getFloatFrequencyData(b); return b;
  };
  const sr = audio.ctx ? audio.ctx.sampleRate : 48000;
  const drawSpec = (b, fill, alpha) => {
    if (!b) return;
    const hz = sr / 2 / b.length;
    x.beginPath(); x.moveTo(0, H);
    for (let px = 0; px <= W; px += 4) {
      const fq = 20 * Math.pow(1000, px / W), i = Math.min(b.length - 1, Math.round(fq / hz));
      const lo = Math.max(1, Math.round(fq / hz * 0.94)), hi = Math.min(b.length - 1, Math.round(fq / hz * 1.06));
      let v = -140; for (let k = lo; k <= Math.max(lo, hi); k++) v = Math.max(v, b[k]); if (!isFinite(v)) v = b[i];
      x.lineTo(px, H - clamp((v + 100) / 80, 0, 1) * (H - 8));
    }
    x.lineTo(W, H); x.closePath(); x.globalAlpha = alpha; x.fillStyle = fill; x.fill(); x.globalAlpha = 1;
  };
  if (!motionOff()) {
    drawSpec(spec(ch.n.anIn, 'binsIn'), col('--faint'), .22);
    drawSpec(spec(ch.n.anOut, 'bins'), acc, .28);
  }
  x.fillStyle = col('--faint'); x.font = '500 18px ' + col('--font');
  [[100, '100'], [1000, '1k'], [10000, '10k']].forEach(([g, l]) => x.fillText(l, X(g) + 5, H - 10));
  x.beginPath();
  for (let i = 0; i < N; i++) { const yy = Y(eqView.cur[i]); i ? x.lineTo(i / (N - 1) * W, yy) : x.moveTo(0, yy); }
  x.lineWidth = 3.5 + eqView.pulse * 2; x.strokeStyle = acc; x.shadowColor = acc; x.shadowBlur = 6 + eqView.pulse * 14; x.stroke(); x.shadowBlur = 0;
  x.lineTo(W, Y(0)); x.lineTo(0, Y(0)); x.closePath(); x.globalAlpha = .12; x.fillStyle = acc; x.fill(); x.globalAlpha = 1;
  BANDS.forEach(([k]) => {
    const g = ch.s[k + 'G']; if (!g) return;
    const i = Math.round(X(ch.s[k + 'F']) / W * (N - 1)), yy = Y(eqView.cur[clamp(i, 0, N - 1)]);
    x.beginPath(); x.arc(X(ch.s[k + 'F']), yy, 8 + eqView.pulse * 3, 0, 7); x.fillStyle = '#fff'; x.fill(); x.lineWidth = 3; x.strokeStyle = acc; x.stroke();
  });
  if (audio.aiActive(ch)) { x.font = '600 17px ' + col('--font'); x.fillStyle = acc; x.fillText('AI CLEANUP ON', W - 150, 26); }
  requestAnimationFrame(eqFrame);
}
