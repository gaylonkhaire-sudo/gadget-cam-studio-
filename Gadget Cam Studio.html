// ---------- autosave + setups ----------
const snapshot = () => ({ cams: cams.map(serializeCam), audio: audio.serialize() });
function saveCurrent() { store.set('current', snapshot()); rememberDevices(); }
let _saveT = 0;
function saveCurrentSoon() { clearTimeout(_saveT); _saveT = setTimeout(saveCurrent, 400); }

async function applySnapshot(cfg) {
  await refreshDevices();
  cams.slice().forEach(removeCam);
  for (const c of cfg.cams || []) {
    const dev = videoDevices.find(d => d.deviceId === c.deviceId) || videoDevices.find(d => c.label && d.label === c.label);
    const cam = newCam({ ...c, deviceId: dev ? dev.deviceId : '' });
    if (!dev && c.deviceId) { cam.status = 'lost'; }
  }
  bus.emit('cams');
  await Promise.all(cams.filter(c => (c.deviceId && c.status !== 'lost') || c.kind === 'image').map(openCam));
  cams.filter(c => c.kind === 'media' || c.kind === 'screen' || c.kind === 'phone').forEach(c => { c.status = 'lost'; });
  await audio.load(cfg.audio || {}, audioDevices);
  bus.emit('cams'); bus.emit('audio');
}

function renderSetups() {
  const list = $('#setups'), all = store.get('setups', {}), active = store.get('activeSetup', '');

  Object.keys(all).forEach(n => {
    const it = h(`<div class="item ${n === active ? 'sel' : ''}">${icon('layers', 'sm')}<span class="grow">${esc(n)}<div class="sub">${all[n].cams.length} cam · ${(all[n].audio.channels || []).length} audio</div></span><button class="x" title="Delete">${icon('x', 'sm')}</button></div>`);
    it.onclick = async e => {

      if (recState.active) return toast('Stop recording to switch setups', 'err');
      store.set('activeSetup', n); renderSetups();
      toast(`Loading “${n}”…`);
      await applySnapshot(all[n]); saveCurrent(); select(null);
    };
    list.appendChild(it);
  });
}

let freeBytes = null;
async function pollFree() { if (NATIVE && folder.kind === 'native') { try { freeBytes = await NATIVE.freeSpace(); } catch { freeBytes = null; } } }
setInterval(pollFree, 5000);
setInterval(() => {
  $('#timer').textContent = fmtTime(recState.active ? performance.now() - recState.start : 0);
  const hl = recHealth(), pill = $('#health');
  const dropping = cams.filter(c => c.alive && c.health.low);
  const lost = cams.filter(c => c.status === 'lost');
  let cls = 'pill', txt;
  if (recState.active) {
    txt = fmtBytes(hl.bytes);
    if (freeBytes != null) { const left = freeBytes / Math.max(1, hl.perSec); txt += ` · ${fmtDur(left)} left`; if (left < 600) cls += ' bad'; else if (left < 1800) cls += ' warn'; }
  } else {
    txt = cams.some(c => c.alive) ? `${fmtBytes(hl.perHour)} per hour` : 'Ready';
    if (freeBytes != null && cams.some(c => c.alive)) txt += ` · ${fmtBytes(freeBytes)} free`;
  }
  if (lost.length) { cls = 'pill bad'; txt = `${lost[0].name} disconnected`; }
  else if (dropping.length) { cls = 'pill warn'; txt = `${dropping[0].name}: ${dropping[0].health.fps} fps`; }
  pill.className = cls; pill.innerHTML = icon(lost.length || dropping.length ? 'warn' : 'drive', 'sm') + esc(txt);
}, 500);

    t.style.fontSize = cfg.size + 'px'; d.body.classList.toggle('mirror', cfg.mirror);
    d.getElementById('mirror').classList.toggle('on', cfg.mirror); d.getElementById('auto').classList.toggle('on', cfg.auto);
    d.getElementById('speed').value = cfg.speed; d.getElementById('size').value = cfg.size;

  const tick = ts => { if (!playing) return; if (last) { pos += cfg.speed * (ts - last) / 1000; view.scrollTop = pos; } last = ts; w.requestAnimationFrame(tick); };
  apply();
  d.getElementById('play').onclick = () => setPlay(!playing);
  d.getElementById('speed').oninput = e => { cfg.speed = +e.target.value; apply(); };
  d.getElementById('size').oninput = e => { cfg.size = +e.target.value; apply(); };
  d.getElementById('mirror').onclick = () => { cfg.mirror = !cfg.mirror; apply(); };
  d.getElementById('auto').onclick = () => { cfg.auto = !cfg.auto; apply(); };
  d.getElementById('top').onclick = () => { view.scrollTop = 0; pos = 0; };
  t.addEventListener('input', () => store.set('prompter', t.innerText));
  t.addEventListener('focus', () => setPlay(false));
  view.addEventListener('wheel', () => { pos = view.scrollTop; }, { passive: true });
  d.addEventListener('keydown', e => {
    if (d.activeElement === t) { if (e.key === 'Escape') t.blur(); return; }

// ---- 11-perf.js ----
// Performance budget: estimate load from every camera, warn before it's too much, offer one-click fixes.
// 1 unit = one 1080p30 camera (preview + recording). The budget scales with this computer's CPU, memory and GPU.
const perf = (() => {
  let info = null;
  function detect() {
    if (info) return info;
    const cores = navigator.hardwareConcurrency || 4, mem = navigator.deviceMemory || 8;
    let gpu = '';
    try {
      const gl = document.createElement('canvas').getContext('webgl2');
      const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
      gpu = gl ? String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER)) : '';
    } catch {}
    const software = /swiftshader|llvmpipe|basic render|software/i.test(gpu);
    let budget = clamp(cores / 2, 2, 8);
    if (mem < 8) budget *= 0.75;
    if (software) budget = Math.min(budget, 1.5);
    const gpuName = gpu.replace(/ANGLE \(|\)$|Direct3D11.*|vs_\d.*|, D3D11.*/g, '').replace(/\s+/g, ' ').trim().split(',').slice(-1)[0].trim();
    info = { cores, mem, gpu: gpuName || 'Unknown graphics', software, budget };
    return info;
  }

  // load of one camera; o overrides { res, fps, vert, processed }
  function camLoad(cam, o = {}) {
    const res = o.res || cam.res, fps = +(o.fps || cam.fps);
    const r = RES[res] || RES['1080'];
    const live = !o.res && cam.actual && cam.alive;
    const w = live ? cam.actual.w : r.w, hh = live ? cam.actual.h : r.h, f = live && !o.fps ? cam.actual.fps : fps;
    const base = (w * hh * f) / (1920 * 1080 * 30);
    const processed = o.processed ?? (adjActive(cam.adj) || (cam.lut.name && cam.lut.bake));
    const vert = o.vert ?? cam.vert.on;
    const parts = { camera: base, preview: 0.05 * base, color: processed ? 0.5 * base : 0, vertical: vert ? 0.6 * base : 0 };
    return { total: Object.values(parts).reduce((a, b) => a + b, 0), parts, w, h: hh, fps: f };
  }
  function outputLoad() {
    if (typeof vcamState === 'undefined' || !(vcamState.on || (outWin && !outWin.closed))) return 0;
    const [w, hh] = OUT_RES[program.res] || OUT_RES['720'];
    return (w * hh * program.fps) / (1920 * 1080 * 30) * (program.pipIdx >= 0 ? 0.8 : 0.5);
  }
  function total(extra = 0) {
    return cams.filter(c => c.deviceId && c.status !== 'idle').reduce((a, c) => a + camLoad(c).total, 0) + outputLoad() + extra;
  }
  function level(t = total()) {
    const pct = Math.round(t / detect().budget * 100);
    return { pct, state: pct > 100 ? 'over' : pct >= 75 ? 'heavy' : 'ok' };
  }
  function diskMbps() {
    return cams.filter(c => c.alive).reduce((a, c) => a + project.bitrate / 1e6 * (c.vert.on ? 1.6 : 1), 0);
  }
  function issues() {
    const out = [], lv = level();
    if (lv.state === 'over') out.push({ kind: 'bad', text: `About ${lv.pct}% of what this computer can comfortably handle. Expect dropped frames.` });
    else if (lv.state === 'heavy') out.push({ kind: 'warn', text: `About ${lv.pct}% of capacity. Fine for short takes; long ones may drop frames.` });
    const fourK = cams.filter(c => c.alive && c.actual && c.actual.h >= 2160);
    if (fourK.length >= 2) out.push({ kind: 'warn', text: `${fourK.length} cameras at 4K. If they share a USB port or hub, they can run out of bandwidth. Use separate ports.` });
    const mbps = diskMbps();
    if (mbps > 150) out.push({ kind: 'warn', text: `Writing about ${Math.round(mbps)} Mbps to disk. Record to an internal SSD, not a USB flash drive.` });
    if (detect().software) out.push({ kind: 'bad', text: 'Graphics acceleration is off in this browser, so every camera is drawn in software. Turn on hardware acceleration in Chrome or Edge settings.' });
    return out;
  }
  return { detect, camLoad, total, level, issues, diskMbps, outputLoad };
})();

// ---------- one-click fixes ----------
async function perfFix(kind) {
  if (recState.active) return toast('Stop recording first', 'err');
  const live = cams.filter(c => c.deviceId);
  if (kind === '1080') { for (const c of live) if (c.res === '2160') { c.res = '1080'; await openCam(c); } }
  if (kind === '30') { for (const c of live) if (c.fps > 30) { c.fps = 30; await openCam(c); } }
  if (kind === 'vert') live.forEach(c => { c.vert.on = false; paintTile(c); });
  saveCurrent(); renderAll(); paintLoad();
  toast(`Now at ${perf.level().pct}% of capacity`);
}

// ---------- warn before adding a camera ----------
function confirmAddCamera(label) {
  const pref = { res: store.get('prefRes', '1080'), fps: store.get('prefFps', 30) };
  const add = perf.camLoad({ res: pref.res, fps: pref.fps, adj: ADJ_DEFAULT, lut: {}, vert: {} }, { ...pref, processed: false, vert: false }).total;
  const after = perf.level(perf.total(add));
  if (after.state === 'ok') return Promise.resolve('add');
  const lighter = perf.level(perf.total(perf.camLoad({ adj: ADJ_DEFAULT, lut: {}, vert: {} }, { res: '720', fps: 30, processed: false, vert: false }).total));
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    const d = openMenu(after.state === 'over' ? 'That may be too many cameras' : 'This computer is getting busy', `
      <div class="perfbar ${after.state}"><i style="width:${Math.min(100, after.pct)}%"></i></div>
      <p class="note" style="padding:8px 0 14px">Adding ${esc(shortName(label) || 'this camera')} at ${RES[pref.res].l} ${pref.fps} fps brings you to about <b>${after.pct}%</b> of what this computer can comfortably record.
      ${after.state === 'over' ? 'Previews may stutter and recordings may drop frames.' : 'Short takes should be fine.'}</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${lighter.state !== 'over' ? `<button class="btn primary" data-v="720" style="justify-content:center">Add at 720p 30 fps (${lighter.pct}%)</button>` : ''}
        <button class="btn" data-v="add" style="justify-content:center">Add anyway</button>
        <button class="btn" data-v="cancel" style="justify-content:center">Cancel</button>
      </div>`, (body, dlg) => body.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { finish(b.dataset.v); dlg.close(); }));
    d.addEventListener('close', () => finish('cancel'), { once: true });
  });
}

// warn once when a settings change crosses into heavy/over
let lastState = 'ok';
function checkLoad(reason) {
  const lv = perf.level();
  const worse = { ok: 0, heavy: 1, over: 2 };
  if (worse[lv.state] > worse[lastState]) {
    toast(lv.state === 'over' ? `Load is now ${lv.pct}%. Expect dropped frames. Click the load meter for fixes.` : `Load is now ${lv.pct}%. Long takes may drop frames.`, lv.state === 'over' ? 'err' : '');
  }

}

  const iss = perf.issues();

    ${iss.map(i => `<div class="r" style="border:0;align-items:flex-start"><span style="color:var(--${i.kind === 'bad' ? 'rec' : 'warn'});padding-top:2px">${icon('warn', 'sm')}</span><div class="lb"><small style="color:var(--text);font-size:12.5px">${esc(i.text)}</small></div></div>`).join('')}
    ${ui.group('Cameras', rows)}

      ${has4k ? '<button class="btn" data-fix="1080">Use 1080p everywhere</button>' : ''}
      ${has60 ? '<button class="btn" data-fix="30">Use 30 fps everywhere</button>' : ''}
      ${hasVert ? '<button class="btn" data-fix="vert">Turn off 9:16 copies</button>' : ''}</div>`) : ''}
    <p class="note">This computer: ${hw.cores} CPU threads${navigator.deviceMemory ? `, ${hw.mem}+ GB memory` : ''}, ${esc(hw.gpu)}. Color adjustments, LUTs baked into the file and 9:16 copies each add work per camera. The estimate is a guide; the live frame-rate warnings show what's really happening.</p>`,
    (body, dlg) => body.querySelectorAll('[data-fix]').forEach(b => b.onclick = async () => { dlg.close(); await perfFix(b.dataset.fix); openPerf(); }));

// live watchdog: sustained frame drops while recording
let lowSince = 0, warnedLive = false;
setInterval(() => {
  paintLoad();
  if (!recState.active) { lowSince = 0; warnedLive = false; return; }
  const low = cams.filter(c => c.alive && c.health.low);
  if (!low.length) { lowSince = 0; return; }
  lowSince = lowSince || Date.now();
  if (!warnedLive && Date.now() - lowSince > 5000) {
    warnedLive = true;
    toast(`${low.map(c => c.name).join(' and ')} ${low.length > 1 ? 'are' : 'is'} dropping frames. Next take, try fewer cameras, 1080p or 30 fps.`, 'err');
  }
}, 1000);

// Program output: one clean feed (camera + look + optional picture-in-picture) for the virtual camera and the output window.

program.vcam = false;                         // never auto-start a camera other apps can see
const saveProgram = () => store.set('program', { ...program, vcam: false });
const OUT_RES = { '720': [1280, 720], '1080': [1920, 1080] };
let progLive = false, progTimer = 0, outWin = null, vcamState = { on: false, error: '', mode: null, connected: false };
const vcamName = () => vcamState.mode === 'gcs' ? 'Gadget Cam Studio' : 'OBS Virtual Camera';
let progR = null, pipR = null;
const comp = document.createElement('canvas');
const cctx = comp.getContext('2d', { alpha: false });

const progCam = () => cams[program.camIdx] || cams.find(c => c.alive) || null;
const pipCam = () => program.pipIdx >= 0 && program.pipIdx !== program.camIdx ? cams[program.pipIdx] || null : null;

function setProgramCam(cam) {
  const i = cams.indexOf(cam); if (i < 0) return;

// ---------- RGB → NV12 on the GPU (BT.709, limited range, like OBS) ----------
function makeNV12() {
  const cv = document.createElement('canvas');
  const gl = cv.getContext('webgl2', { alpha: false, antialias: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
  if (!gl) return null;
  const vs = `#version 300 es
  in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
  const fs = `#version 300 es
  precision highp float; uniform sampler2D src; uniform vec2 size; out vec4 o;
  void main(){
    ivec2 q = ivec2(gl_FragCoord.xy); int H = int(size.y); vec4 r = vec4(0.);

  if (!comp.width) composeFrame();
  miniVideo.srcObject = comp.captureStream(program.fps);
  await miniVideo.play().catch(() => {});
  try { await miniVideo.requestPictureInPicture(); ensureLoop(); } catch (e) { toast('Could not open the floating preview: ' + e.message, 'err'); }
  paintToolbar();
}

// ---- 14-campresets.js ----
// Camera presets: save a camera's settings under a name, apply them to any camera, export/import between computers.
// Plus device memory: a camera you plug back in gets the settings it had last time.
const PRESET_PARTS = [
  ['image', 'Image adjustments', 'Look, light, color and detail'],
  ['framing', 'Framing', 'Zoom, pan, tilt, rotate, mirror, 9:16 copy'],
  ['lut', 'LUT', 'Which LUT, strength, record with LUT'],
  ['key', 'Green screen', 'Key settings and background'],
  ['controls', 'Camera controls', 'Exposure, white balance, focus on the camera itself'],
  ['format', 'Resolution & frame rate', ''],
  ['monitor', 'Monitoring', 'Zebras and focus peaking'],
  ['file', 'File name', ''],
];
const PART_KEYS = {
  image: [...LOOK_KEYS, 'look', 'lookEdited'],
  framing: ['zoom', 'panX', 'panY', 'rot', 'mirror', 'flip'],
  key: ['key', 'keyColor', 'keySim', 'keySmooth', 'keySpill', 'bgMode', 'bgColor', 'bgKey'],
  monitor: ['zebra', 'peaking'],
};

function capturePreset(cam, parts) {
  const d = { parts: [...parts] };
  if (parts.includes('image') || parts.includes('framing') || parts.includes('key') || parts.includes('monitor')) {
    d.adj = {};
    for (const p of ['image', 'framing', 'key', 'monitor']) if (parts.includes(p)) PART_KEYS[p].forEach(k => d.adj[k] = cam.adj[k]);
  }
  if (parts.includes('framing')) d.vert = { ...cam.vert };
  if (parts.includes('lut')) d.lut = { ...cam.lut };
  if (parts.includes('controls')) d.hw = { ...cam.hw };
  if (parts.includes('format')) { d.res = cam.res; d.fps = cam.fps; }
  if (parts.includes('file')) { d.fileName = cam.fileName || ''; d.naming = cam.naming || null; }
  return d;
}

async function applyPreset(cam, d, name) {
  if (recState.active && d.parts.includes('format')) return toast('Stop recording to change resolution or frame rate', 'err');
  if (d.adj) Object.assign(cam.adj, d.adj);
  if (d.vert) cam.vert = { ...cam.vert, ...d.vert };
  if (d.lut) { cam.lut = { ...cam.lut, ...d.lut }; if (cam.lut.name && !luts.has(cam.lut.name)) { toast(`LUT “${cam.lut.name}” isn’t on this computer. Import it to use it.`, 'err'); cam.lut.name = ''; } }
  if (d.fileName !== undefined) cam.fileName = d.fileName;
  if (d.naming !== undefined) cam.naming = d.naming;
  if (d.adj && d.adj.bgKey) { const blob = await idbGet('blobs', d.adj.bgKey); if (blob) await setCamBg(cam, blob, false); }
  syncRenderers(cam);
  let reopen = false;
  if (d.res && d.res !== cam.res) { cam.res = d.res; reopen = true; }
  if (d.fps && +d.fps !== cam.fps) { cam.fps = +d.fps; reopen = true; }
  if (d.hw) cam.hw = { ...cam.hw, ...d.hw };
  if (reopen && cam.deviceId) await openCam(cam);
  else if (d.hw && cam.alive) await applyHw(cam);
  cam.preset = name || '';
  paintTile(cam); saveCurrent(); checkLoad();
  if (isSel(cam)) renderInspector();
}

// ---------- device memory ----------
function rememberDevices() {
  const mem = store.get('deviceMemory', {});
  for (const c of cams) if (c.label) mem[c.label] = { ...capturePreset(c, PRESET_PARTS.map(p => p[0])), name: c.name };
  store.set('deviceMemory', mem);
}
function recallDevice(label) {
  const m = store.get('deviceMemory', {})[label];
  return m ? { adj: { ...ADJ_DEFAULT, ...(m.adj || {}) }, vert: m.vert, lut: m.lut, hw: m.hw, res: m.res, fps: m.fps, fileName: m.fileName, naming: m.naming, name: m.name } : {};
}

async function exportPresets() {
  const data = { app: 'Gadget Cam Studio', kind: 'presets', version: 1, exported: new Date().toISOString(),
    camPresets: store.get('camPresets', {}), userLooks: store.get('userLooks', {}), userPresets: store.get('userPresets', {}), setups: store.get('setups', {}) };
  const name = `Gadget Cam Studio presets ${new Date().toISOString().slice(0, 10)}.json`;
  if (NATIVE) { const p = await NATIVE.writeText(name, JSON.stringify(data, null, 2)); toast(`Saved ${String(p).split(/[\\/]/).pop()} to your recordings folder`); }
  else download(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), name);
}
function importPresets(done) {
  const f = document.createElement('input'); f.type = 'file'; f.accept = '.json,application/json';
  f.onchange = async () => {
    try {
      const d = JSON.parse(await f.files[0].text());
      if (d.app !== 'Gadget Cam Studio' || d.kind !== 'presets') throw new Error('This isn’t a Gadget Cam Studio presets file');
      let n = 0;
      for (const k of ['camPresets', 'userLooks', 'userPresets', 'setups']) {
        const cur = store.get(k, {}), inc = d[k] || {};
        Object.assign(cur, inc); n += Object.keys(inc).length; store.set(k, cur);
      }
      toast(`Imported ${n} presets`); renderSetups(); renderInspector(); done && done();
    } catch (e) { toast('Import failed: ' + e.message, 'err'); }
  };
  f.click();
}

// ---- 15-phones.js ----
// Phones as cameras or microphones over Wi-Fi (Windows app). The phone opens a page from our local server
// (QR code), we exchange WebRTC offers through that server, and the video/audio flows phone → app directly.
const phones = new Map();       // phoneId → { id, name, mode, pc, dc, cam, ch, caps, stats, state }
let phoneInfo = null, phoneES = null, pairDlgOpen = false;
const allowedPhones = () => store.get('allowedPhones', {});
const pendingPhones = new Map();

async function phoneService() {
  if (!NATIVE || !NATIVE.phoneInfo) return null;
  if (!phoneInfo) {
    try { phoneInfo = await NATIVE.phoneInfo(); }
    catch (e) { log('Phone server could not start: ' + e.message); return null; }
  }
  if (!phoneES) listenPhones();
  return phoneInfo;
}
function listenPhones() {
  phoneES = new EventSource(`${phoneInfo.appUrl}/events?role=app&k=${encodeURIComponent(phoneInfo.token)}`);
  phoneES.onopen = () => phoneSignal({ to: 'phones', type: 'who' });
  phoneES.onmessage = e => { try { onPhoneMsg(JSON.parse(e.data)); } catch (err) { console.warn(err); } };
}
function phoneSignal(m) {
  if (!phoneInfo) return;
  return fetch(`${phoneInfo.appUrl}/signal?k=${encodeURIComponent(phoneInfo.token)}`, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ from: 'app', ...m }) }).catch(() => {});
}

async function onPhoneMsg(m) {
  const p = phones.get(m.from);
  if (m.type === 'hello') {
    const allowed = allowedPhones()[m.from];
    if (allowed || !store.get('askNewPhones', true)) return connectPhone(m.from, m.name, m.mode || 'camera');
    if (pendingPhones.has(m.from)) return;
    pendingPhones.set(m.from, m);
    askToAllow(m);
  } else if (m.type === 'answer' && p && p.pc) {
    await p.pc.setRemoteDescription({ type: 'answer', sdp: m.sdp });
  } else if (m.type === 'ice' && p && p.pc && m.candidate) {
    try { await p.pc.addIceCandidate(m.candidate); } catch {}
  } else if (m.type === 'bye' && p) {
    setTimeout(() => { const q = phones.get(m.from); if (q && q.pc && q.pc.connectionState !== 'connected') phoneLost(q); }, 4000);
  }
}

function askToAllow(m) {
  const kind = m.mode === 'mic' ? 'microphone' : 'camera';
  const d = openMenu('New phone', `
    <div style="text-align:center;padding:6px 0 4px">${icon(m.mode === 'mic' ? 'mic' : 'phone')}
      <p style="margin:10px 0 4px;font-size:15px"><b>${esc(m.name || 'A phone')}</b> wants to join as a ${kind}.</p>
      <p class="note" style="padding:0 0 14px">Only allow phones you recognize. Allowed phones reconnect on their own next time.</p></div>
    <div style="display:flex;gap:8px"><button class="btn" data-a="no" style="flex:1;justify-content:center">Decline</button><button class="btn primary" data-a="yes" style="flex:1;justify-content:center">Allow</button></div>`,
    (body, dlg) => body.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      dlg.close(); pendingPhones.delete(m.from);
      if (b.dataset.a === 'yes') { const a = allowedPhones(); a[m.from] = { name: m.name, at: Date.now() }; store.set('allowedPhones', a); connectPhone(m.from, m.name, m.mode || 'camera'); }
      else { phoneSignal({ to: m.from, type: 'declined' }); log(`Declined ${m.name || 'a phone'}`); }
    }));
  d.addEventListener('close', () => pendingPhones.delete(m.from), { once: true });
}

// prefer the phone's hardware H.264 encoder (High profile first), then VP9
function preferCodecs(tr) {
  if (!tr.setCodecPreferences || !RTCRtpReceiver.getCapabilities) return;
  const list = RTCRtpReceiver.getCapabilities('video').codecs;
  const score = c => {
    const m = c.mimeType.toLowerCase(), f = c.sdpFmtpLine || '';
    if (m === 'video/h264') return /profile-level-id=64/i.test(f) ? 0 : /profile-level-id=4d/i.test(f) ? 1 : 2;
    if (m === 'video/vp9') return 3; if (m === 'video/av1') return 4; if (m === 'video/vp8') return 5;
    return 9;                                     // rtx, red, ulpfec stay at the end
  };
  try { tr.setCodecPreferences(list.slice().sort((a, b) => score(a) - score(b))); } catch {}
}
// tell the phone it may send a lot: high video bandwidth, stereo full-rate Opus
function boostSdp(sdp) {
  return sdp.split(/(?=\r\nm=)/).map(sec => {
    if (/^(\r\n)?m=video/.test(sec)) {
      if (!/\r\nb=AS:/.test(sec)) sec = sec.replace(/(\r\nc=[^\r\n]*)/, '$1\r\nb=AS:45000');
      const pts = [...sec.matchAll(/a=rtpmap:(\d+) (H264|VP9|VP8|AV1)\//gi)].map(m => m[1]);
      for (const pt of pts) sec = sec.replace(new RegExp(`(\\r\\na=fmtp:${pt} [^\\r\\n]*)`), '$1;x-google-start-bitrate=15000;x-google-min-bitrate=5000;x-google-max-bitrate=45000');
    }
    if (/^(\r\n)?m=audio/.test(sec)) {
      const pt = (sec.match(/a=rtpmap:(\d+) opus\/48000/i) || [])[1];
      if (pt) sec = sec.replace(new RegExp(`(\\r\\na=fmtp:${pt} [^\\r\\n]*)`), '$1;stereo=1;sprop-stereo=1;maxaveragebitrate=510000;usedtx=0;useinbandfec=1');
    }
    return sec;
  }).join('');
}

function uniqueCamName(base) {
  let n = base, i = 2;
  while (cams.some(c => c.name === n)) n = `${base} ${i++}`;
  return n;
}

async function connectPhone(id, name, mode) {
  const old = phones.get(id);
  if (old && old.pc) { try { old.pc.close(); } catch {} }
  const p = old || { id };
  Object.assign(p, { name: name || p.name || 'Phone', mode, state: 'connecting', caps: null, stats: null });
  phones.set(id, p);
  if (mode === 'camera') {
    p.cam = cams.find(c => c.kind === 'phone' && c.phoneId === id) || null;
    if (!p.cam) {
      p.cam = newCam({ kind: 'phone', phoneId: id, name: uniqueCamName(p.name), res: '2160', fps: 30 });
      p.cam.status = 'lost';
      bus.emit('cams');
    }
  }
  if (p.ch) { audio.remove(p.ch); p.ch = null; }
  const pc = p.pc = new RTCPeerConnection({ iceServers: [] });
  if (mode === 'camera') preferCodecs(pc.addTransceiver('video', { direction: 'recvonly' }));
  pc.addTransceiver('audio', { direction: 'recvonly' });
  const dc = p.dc = pc.createDataChannel('ctl');
  dc.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'caps') { p.caps = m; if (m.name) p.name = m.name; if (p.cam && isSel(p.cam) && inspTab === 'camera') renderInspector(); renderPairList(); }
    if (m.type === 'stats') { p.stats = m; const el = $('#phoneStats'); if (el && p.cam && isSel(p.cam)) el.textContent = phoneStatsText(p); }
  };
  pc.onicecandidate = e => { if (e.candidate) phoneSignal({ to: id, type: 'ice', candidate: e.candidate }); };
  pc.ontrack = async e => {
    const t = e.track;
    if (t.kind === 'video' && p.cam) {
      p.cam.remoteStream = new MediaStream([t]);
      await openCam(p.cam);
      t.addEventListener('ended', () => phoneLost(p));
    }
    if (t.kind === 'audio') {
      const isMic = mode === 'mic';
      const ch = await audio.addChannel({ kind: 'phone', name: isMic ? p.name : `${p.cam ? p.cam.name : p.name} mic`, stream: new MediaStream([t]),
        s: { ...withPreset(isMic ? 'Natural Voice' : 'Phone mic'), recMute: !isMic, monMute: true } });
      p.ch = ch;
      if (!isMic) log(`${ch.name} added to the mixer, muted in the recording. Unmute REC to use it.`);
      if (isMic) toast(`${p.name} is ready as a microphone`);
    }
  };
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    p.state = s;
    if (s === 'connected') { log(`${p.name} connected (${mode})`); if (mode === 'camera') toast(`${p.cam.name} connected`); }
    if (s === 'failed' || s === 'closed') phoneLost(p);
    if (s === 'disconnected') setTimeout(() => { if (pc.connectionState === 'disconnected') phoneLost(p); }, 4000);
    renderPairList();
  };
  const offer = await pc.createOffer();
  const sdp = boostSdp(offer.sdp);
  await pc.setLocalDescription({ type: 'offer', sdp });
  phoneSignal({ to: id, type: 'offer', sdp });
  renderPairList();
}

function phoneLost(p) {
  if (p.state === 'lost') return;
  p.state = 'lost';
  if (p.cam && p.cam.status !== 'lost') { p.cam.alive = false; p.cam.status = 'lost'; p.cam.remoteStream = null; bus.emit('camLost', p.cam); bus.emit('cam', p.cam); }
  if (p.ch) { p.ch.alive = false; bus.emit('audio'); }
  log(`${p.name} disconnected`);
  renderPairList();
}
function closePhone(cam) {
  for (const p of phones.values()) if (p.cam === cam) { try { p.pc && p.pc.close(); } catch {} if (p.ch) audio.remove(p.ch); phones.delete(p.id); }
}
function phoneOf(cam) { for (const p of phones.values()) if (p.cam === cam) return p; return null; }
function phoneCmd(cam, cmd) { const p = phoneOf(cam); if (p && p.dc && p.dc.readyState === 'open') p.dc.send(JSON.stringify({ cmd: 'set', ...cmd })); }

// File name builder: pick pieces (Project, Take, Camera, Date…), order them, choose a separator, see the result live.
const NAME_PIECES = [
  ['project', 'Project'], ['take', 'Take'], ['camera', 'Camera'], ['date', 'Date'], ['time', 'Time'], ['setup', 'Setup'], ['text', 'Your text'],
];
const SEPARATORS = [['_', 'Underscore  _'], ['-', 'Dash  -'], [' ', 'Space'], ['', 'None']];
const DEFAULT_NAMING = { parts: [{ t: 'project' }, { t: 'take' }, { t: 'camera' }], sep: '_' };
const NAME_STYLES = [
  ['Project, take, camera', { parts: [{ t: 'project' }, { t: 'take' }, { t: 'camera' }], sep: '_' }],
  ['Date, project, camera', { parts: [{ t: 'date' }, { t: 'project' }, { t: 'camera' }], sep: ' ' }],
  ['Camera, take', { parts: [{ t: 'camera' }, { t: 'take' }], sep: '_' }],
  ['Project, camera, time', { parts: [{ t: 'project' }, { t: 'camera' }, { t: 'time' }], sep: '-' }],
];
const cloneNaming = n => ({ parts: (n.parts || []).map(p => ({ ...p })), sep: n.sep ?? '_' });

function namingToPattern(n) {
  return (n.parts || []).map(p => p.t === 'text' ? (p.v || '').replace(/[{}]/g, '') : p.t === 'take' ? 'T{take}' : `{${p.t}}`).filter(Boolean).join(n.sep ?? '_');
}
// legacy {token} patterns → builder parts (best effort)
function patternToNaming(pat) {
  if (!pat || !pat.trim()) return null;
  const sepM = pat.match(/\}([ _\-])/);
  const sep = sepM ? sepM[1] : '_';
  const parts = [];
  for (const tok of pat.split(/(T?\{\w+\})/)) {
    const m = tok.match(/^T?\{(\w+)\}$/);
    if (m) { parts.push({ t: m[1].toLowerCase() }); continue; }
    const txt = tok.replace(/^[ _\-]+|[ _\-]+$/g, '');
    if (txt) parts.push({ t: 'text', v: txt });
  }
  return parts.length ? { parts, sep } : null;
}
const defaultNaming = () => project.naming || patternToNaming(project.filePattern) || DEFAULT_NAMING;
const camNaming = cam => cam.naming || patternToNaming(cam.fileName) || null;     // null = same as other cameras

function previewName(naming, cam) {
  const c = cam || { name: cams[0] ? cams[0].name : 'Camera 1' };
  const tmp = { ...c, naming, fileName: '' };
  return fileBaseFor(tmp);
}

function renameCam(cam, name) {

// ---- 18-sources.js ----
// Sources besides cameras: video clips (reaction content), images, and screen or app window shares.
// They behave like cameras: preview tile, looks/framing, recording, and main or picture-in-picture on the output.
const SOURCE_KINDS = { media: 'Video', image: 'Image', screen: 'Screen', phone: 'Phone' };
const isSourceKind = cam => cam.kind && cam.kind !== 'device';

// ---------- open / close ----------
async function openSource(cam) {
  cam.loop = null;
  if (cam.kind === 'phone' || cam.kind === 'screen') {
    const s = cam.kind === 'phone' ? cam.remoteStream : cam.stream;
    const t = s && s.getVideoTracks()[0];
    if (!t || t.readyState === 'ended') { cam.stream = null; cam.alive = false; cam.status = 'lost'; bus.emit('cam', cam); return; }
    cam.stream = s;
    cam.video.srcObject = s; cam.video.muted = true;
    t.onended = () => { cam.alive = false; cam.status = 'lost'; bus.emit('camLost', cam); bus.emit('cam', cam); if (cam.kind === 'screen') toast(`${cam.name}: sharing stopped`, 'err'); };
  } else if (cam.kind === 'media') {
    if (!cam.mediaUrl) { cam.alive = false; cam.status = 'lost'; bus.emit('cam', cam); return; }
    cam.stream = null;
    if (cam.video.src !== cam.mediaUrl) { cam.video.srcObject = null; cam.video.src = cam.mediaUrl; }
    cam.video.loop = !!cam.media.loop;
    attachMediaAudio(cam);
  } else if (cam.kind === 'image') {
    if (!cam.img) {
      const blob = cam.imgBlob || (cam.imgKey && await idbGet('blobs', cam.imgKey));
      if (!blob) { cam.alive = false; cam.status = 'lost'; bus.emit('cam', cam); return; }
      cam.img = new Image(); cam.img.decoding = 'async'; cam.img.src = URL.createObjectURL(blob);
      await cam.img.decode().catch(() => {});
    }
  }
  if (cam.kind !== 'image') {
    cam.video.play().catch(() => {});
    if (cam.video.readyState < 2) await Promise.race([new Promise(r => cam.video.addEventListener('loadeddata', r, { once: true })), sleep(4000)]);
    if (cam.kind === 'media' && !cam.media.autoplay) cam.video.pause();
  }
  const el = srcEl(cam);
  cam.actual = { w: el.videoWidth || el.naturalWidth || 1920, h: el.videoHeight || el.naturalHeight || 1080, fps: cam.kind === 'image' ? 30 : Math.round((cam.stream && cam.stream.getVideoTracks()[0].getSettings().frameRate) || 30) };
  if (cam.kind !== 'image') cam.video.onresize = () => { cam.actual.w = cam.video.videoWidth; cam.actual.h = cam.video.videoHeight; paintTile(cam); };
  cam.alive = true; cam.status = 'live';
  startLoop(cam);
  bus.emit('cam', cam); bus.emit('camBack', cam);
}

// a clip's sound goes through the mixer (so you can level it, EQ it, and it's in the recording)
function attachMediaAudio(cam) {
  if (cam.mediaNode || !audio.ctx) return;
  try {
    const ac = audio.ctx;
    cam.mediaNode = ac.createMediaElementSource(cam.video);
    const dest = ac.createMediaStreamDestination(); cam.mediaNode.connect(dest);
    cam.video.muted = false;
    audio.addChannel({ kind: 'media', name: `${cam.name} audio`, stream: dest.stream, s: { ...withPreset('Music (flat)'), monMute: false } }).then(ch => { cam.ch = ch; });
  } catch (e) { log('Clip audio unavailable: ' + e.message); }
}

function releaseSource(cam) {
  if (cam.kind === 'screen' && cam.stream) cam.stream.getTracks().forEach(t => t.stop());
  if (cam.kind === 'media') { cam.video.pause(); if (cam.mediaUrl) URL.revokeObjectURL(cam.mediaUrl); }
  if (cam.kind === 'image' && cam.img) URL.revokeObjectURL(cam.img.src);
  if (cam.ch) { audio.remove(cam.ch); cam.ch = null; }
  if (cam.kind === 'phone' && typeof closePhone === 'function') closePhone(cam);
}

// ---------- adding sources ----------
function pickFile(accept) {
  return new Promise(res => { const f = document.createElement('input'); f.type = 'file'; f.accept = accept; f.onchange = () => res(f.files[0] || null); f.click(); });
}
const baseOf = n => n.replace(/\.[^.]+$/, '').slice(0, 32);

async function addVideoSource(existing) {
  const file = await pickFile('video/*,.mp4,.mov,.webm,.mkv');
  if (!file) return;
  const cam = existing || newCam({ kind: 'media', name: uniqueCamName(baseOf(file.name) || 'Video'), media: { loop: false, autoplay: false, syncRec: true } });
  if (cam.mediaUrl) URL.revokeObjectURL(cam.mediaUrl);
  cam.mediaUrl = URL.createObjectURL(file); cam.label = file.name;
  bus.emit('cams'); select('cam', cam);
  await openSource(cam); saveCurrent(); checkLoad();
  if (!cam.alive) toast('That video could not be played. Try an MP4 (H.264) or WebM file.', 'err');
}
async function addImageSource(existing) {
  const file = await pickFile('image/*');
  if (!file) return;
  const key = 'img_' + uid();
  await idbPut('blobs', key, file);
  const cam = existing || newCam({ kind: 'image', name: uniqueCamName(baseOf(file.name) || 'Image') });
  if (cam.img) { URL.revokeObjectURL(cam.img.src); cam.img = null; }
  cam.imgKey = key; cam.imgBlob = file; cam.label = file.name;
  bus.emit('cams'); select('cam', cam);
  await openSource(cam); saveCurrent();
}

async function addScreenSource(existing) {
  let withAudio = false;
  if (NATIVE && NATIVE.listSources) {
    const pick = await pickScreen(); if (!pick) return;
    withAudio = pick.audio; NATIVE.chooseSource(pick.id, pick.audio);
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30, max: 60 }, cursor: 'always' }, audio: NATIVE ? withAudio : true, systemAudio: 'include', surfaceSwitching: 'include', selfBrowserSurface: 'exclude' });
  } catch (e) { if (e.name !== 'NotAllowedError') toast('Screen sharing: ' + e.message, 'err'); return; }
  const vt = stream.getVideoTracks()[0];
  vt.contentHint = 'detail';
  const label = vt.label || 'Screen';
  const cam = existing || newCam({ kind: 'screen', name: uniqueCamName(/window|tab/i.test(vt.getSettings().displaySurface || '') ? shortName(label).slice(0, 24) || 'App window' : 'Screen') });
  if (cam.stream) cam.stream.getTracks().forEach(t => t.stop());
  cam.stream = stream; cam.label = label;
  if (cam.ch) { audio.remove(cam.ch); cam.ch = null; }

// ---- 19-mix.js ----
// Mix presets + auto-ducking: each input has a role (Voice, Game, Clip, Music, Other). A mix sets each role's level,
// and ducking dips Game/Clip/Music whenever a Voice input is talking, in the recording and in your headphones.
const ROLES = [['voice', 'Voice'], ['game', 'Game'], ['clip', 'Clip'], ['music', 'Music'], ['other', 'Other']];
const roleOf = ch => ch.s.role || (ch.kind === 'media' ? 'clip' : (ch.kind === 'system' || ch.kind === 'screen') ? 'game' : 'voice');
const M = (levels, duck) => ({ levels, duck });
const MIXES = {
  'Voice first': M({ voice: 0, game: -12, clip: -10, music: -18, other: -6 }, { on: false, amount: 8 }),
  'Gaming':      M({ voice: 0, game: -10, clip: -10, music: -20, other: -6 }, { on: true, amount: 9 }),
  'Reaction':    M({ voice: 0, game: -8, clip: -6, music: -18, other: -6 }, { on: true, amount: 12 }),
  'Podcast':     M({ voice: 0, game: -20, clip: -16, music: -24, other: -10 }, { on: true, amount: 14 }),
  'Even':        M({ voice: 0, game: 0, clip: 0, music: 0, other: 0 }, { on: false, amount: 8 }),
};
const mix = { name: 'Voice first', duck: { on: false, amount: 8, sens: 50 }, edited: false, ...store.get('mix', {}) };
const saveMix = () => store.set('mix', mix);
const dbToSlider = db => db <= -60 ? 0 : db <= 0 ? (db + 60) / 60 * 91 : 91 + db / 6 * 9;
const mixSettings = name => MIXES[name] || store.get('userMixes', {})[name];

function applyMix(name) {
  const m = mixSettings(name); if (!m) return;
  const moves = audio.channels.map(ch => {
    const db = m.levels[roleOf(ch)] ?? 0, v = Math.round(dbToSlider(db) * 2) / 2;
    return { ch, r0: ch.s.rec, m0: ch.s.mon, r1: v, m1: ch.s.link ? v : ch.s.mon };
  });
  glideFaders(moves);
  mix.name = name; mix.edited = false;
  mix.duck = { ...mix.duck, on: m.duck.on, amount: m.duck.amount };
  saveMix(); renderStrips(); saveCurrentSoon(); renderMixBar();
  toast(`${name} mix${mix.duck.on ? ` · ducking ${mix.duck.amount} dB` : ''}`);
}
// Faders glide to a new mix like motorized faders (instant when animations are off).
function glideFaders(moves) {
  const t0 = performance.now(), dur = motionOff() ? 0 : 420, ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const t = dur ? Math.min(1, (now - t0) / dur) : 1, k = ease(t);
    for (const mv of moves) {
      const s = mv.ch.s;
      s.rec = t < 1 ? mv.r0 + (mv.r1 - mv.r0) * k : mv.r1; s.mon = t < 1 ? mv.m0 + (mv.m1 - mv.m0) * k : mv.m1;
      audio.apply(mv.ch);
      const el = mv.ch.meterEl && mv.ch.meterEl.closest('.strip');
      if (el) for (const c of ['rec', 'mon']) { const i = el.querySelector('input.vf.' + c), v = el.querySelector('.v.' + c); if (i) i.value = s[c]; if (v) v.textContent = fmtDb(sliderDb(s[c])); }
    }
    if (t < 1) requestAnimationFrame(step); else saveCurrentSoon();
  };
  requestAnimationFrame(step);
}
function captureMix() {
  const levels = {};
  for (const [r] of ROLES) {
    const ch = audio.channels.find(c => roleOf(c) === r);
    if (ch) levels[r] = Math.round(sliderDb(ch.s.rec) === -Infinity ? -60 : sliderDb(ch.s.rec));
  }
  return M({ voice: 0, game: -12, clip: -10, music: -18, other: -6, ...levels }, { on: mix.duck.on, amount: mix.duck.amount });
}

// ---------- ducking engine ----------
let duckGain = 1, voiceHold = 0;
const dbuf = new Float32Array(1024);
setInterval(() => {
  if (!audio.ctx || !audio.channels.length) return;
  let loud = -100;
  const voices = audio.channels.filter(c => roleOf(c) === 'voice' && c.n && !c.s.recMute);
  for (const v of voices) {
    v.n.an.getFloatTimeDomainData(dbuf);
    let sum = 0; for (let i = 0; i < dbuf.length; i++) sum += dbuf[i] * dbuf[i];
    loud = Math.max(loud, 10 * Math.log10(sum / dbuf.length + 1e-12));
  }
  const th = -30 - mix.duck.sens * 0.3;                    // sensitivity 0..100 → -30..-60 dB RMS
  const now = performance.now();
  if (mix.duck.on && loud > th) voiceHold = now + 450;
  const target = mix.duck.on && now < voiceHold ? Math.pow(10, -mix.duck.amount / 20) : 1;
  const T = audio.ctx.currentTime;
  for (const ch of audio.channels) {
    if (!ch.n || !ch.n.duck) continue;
    const r = roleOf(ch), g = r === 'voice' || r === 'other' ? 1 : target;
    // dip fast, recover gently
    ch.n.duck.gain.setTargetAtTime(g, T, g < ch.n.duck.gain.value ? 0.06 : 0.35);
  }
  const was = duckGain < 0.99; duckGain = target;
  if (was !== (duckGain < 0.99)) { const el = $('#duckBtn'); if (el) el.classList.toggle('active', duckGain < 0.99); }
}, 30);

// ---------- UI: Mix bar in the audio dock ----------
function renderMixBar() {
  const host = $('#mixBar'); if (!host) return;

  host.innerHTML = `

      ${Object.keys(mine).length ? `<optgroup label="My mixes">${Object.keys(mine).map(n => `<option ${n === mix.name ? 'selected' : ''}>${esc(n)}</option>`).join('')}</optgroup>` : ''}
      <option value="__save">Save current mix…</option>

// cycle a strip's role with one click
function cycleRole(ch) {
  const i = ROLES.findIndex(r => r[0] === roleOf(ch));
  ch.s.role = ROLES[(i + 1) % ROLES.length][0];

// ---- 20-motion.js ----
// Motion: smooth entrances, layout changes that glide (FLIP), and live audio glows on the mixer strips.
const motion = (() => {
  const EASE = 'cubic-bezier(.2,.8,.2,1)';
  const seenStrips = new WeakSet();

  // play a one-shot class (removed when its animation ends)
  function enter(el, cls = 'm-enter') {
    if (!el || motionOff()) return;
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
  }

  // FLIP: remember where tiles were, change the layout, then glide them from old to new spots
  function flip(change, host = '#grid') {
    const root = $(host);
    if (!root || motionOff()) return change();
    const els = [...root.children].filter(e => e.offsetParent);
    const before = new Map(els.map(e => [e, e.getBoundingClientRect()]));
    change();
    for (const [e, a] of before) {
      if (!e.isConnected || !e.offsetParent) continue;
      const b = e.getBoundingClientRect();
      if (!b.width || !b.height) continue;
      const dx = a.left - b.left, dy = a.top - b.top, sx = a.width / b.width, sy = a.height / b.height;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1 && Math.abs(sx - 1) < .01 && Math.abs(sy - 1) < .01) continue;
      e.animate([{ transformOrigin: '0 0', transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})` },
                 { transformOrigin: '0 0', transform: 'none' }], { duration: 380, easing: EASE });
    }
    // tiles that just appeared fade and scale in
    [...root.children].filter(e => e.offsetParent && !before.has(e)).forEach(e => enter(e));
  }

  // live strip states: talking glow, ducked dip, AI badge breathing with the voice
  const buf = new Float32Array(1024);
  function rms(an) { an.getFloatTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i]; return 10 * Math.log10(s / buf.length + 1e-12); }
  setInterval(() => {
    if (!audio.ctx || document.hidden) return;
    for (const ch of audio.channels) {
      const el = ch.meterEl && ch.meterEl.closest('.strip'); if (!el || !ch.n) continue;
      if (!seenStrips.has(ch)) { seenStrips.add(ch); enter(el); }
      const lvl = rms(ch.n.an), talking = ch.alive && !ch.s.recMute && lvl > -42;
      el.classList.toggle('talking', talking);
      el.style.setProperty('--lvl', clamp((lvl + 60) / 50, 0, 1).toFixed(2));
      const ducked = ch.n.duck && ch.n.duck.gain.value < 0.9;
      el.classList.toggle('ducked', !!ducked);
    }
  }, 60);

  // inspector content rises in when you pick something new
  let lastSel = null;
  bus.on('select', () => {
    const now = selected && selected.obj;
    if (now !== lastSel) { lastSel = now; requestAnimationFrame(() => enter($('#insp'), 'm-insp')); }
  });

  return { enter, flip };
})();

// Wrap layout changes so tiles glide instead of jumping.
{
  const plainApplyView = applyView;
  applyView = (...a) => motion.flip(() => plainApplyView(...a));
}
// New camera tiles pop in once.
{
  const plainTileFor = tileFor;
  tileFor = cam => { const fresh = !cam.tile, t = plainTileFor(cam); if (fresh) requestAnimationFrame(() => motion.enter(t)); return t; };
}
// Dialogs and menus open with a soft spring.
{
  const show = HTMLDialogElement.prototype.showModal;
  HTMLDialogElement.prototype.showModal = function () { show.call(this); motion.enter(this, 'm-pop'); };
}

// ---- 21-extras.js ----
// Titles (lower thirds) on the output, phone remote controls, per-camera audio choice, Phones settings, hotkeys, updates.

// ---------- titles ----------
const titles = { list: [], style: 'bar', align: 'left', color: '#0a84ff', autoHide: 8, size: 100, ...store.get('titles', {}) };
const saveTitles = () => store.set('titles', { ...titles, list: titles.list });
const titleLive = { id: null, t0: 0, out: 0, last: null, timer: null };
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);

function showTitle(id) {
  const t = titles.list.find(x => x.id === id); if (!t) return;
  clearTimeout(titleLive.timer);
  Object.assign(titleLive, { id, t0: performance.now(), out: 0, last: id });
  if (titles.autoHide > 0) titleLive.timer = setTimeout(hideTitle, titles.autoHide * 1000);
  ensureLoop(); paintTitleButtons();
}
function hideTitle() {
  clearTimeout(titleLive.timer);
  if (titleLive.id && !titleLive.out) titleLive.out = performance.now();
  paintTitleButtons();
}
function toggleTitle() {
  if (titleLive.id && !titleLive.out) return hideTitle();
  const id = titleLive.last && titles.list.some(t => t.id === titleLive.last) ? titleLive.last : titles.list[0] && titles.list[0].id;
  if (!id) return toast('Add a title in the Output panel first', 'err');
  showTitle(id);
}
function paintTitleButtons() {
  $$('#insp [data-tshow]').forEach(b => { const on = b.dataset.tshow === titleLive.id && !titleLive.out; b.textContent = on ? 'Hide' : 'Show'; b.classList.toggle('primary', on); });
}

// drawn into the output (so it's in the virtual camera, output window and output recording)
function drawTitles(x, W, H) {
  if (!titleLive.id) return;
  const t = titles.list.find(q => q.id === titleLive.id); if (!t) { titleLive.id = null; return; }
  const now = performance.now(), anim = !motionOff();
  const pin = anim ? ease((now - titleLive.t0) / 450) : 1;
  const pout = titleLive.out ? (anim ? ease((now - titleLive.out) / 350) : 1) : 0;
  if (pout >= 1) { titleLive.id = null; titleLive.out = 0; paintTitleButtons(); return; }
  const k = pin * (1 - pout), sc = H / 1080 * titles.size / 100;
  const f1 = Math.round(54 * sc), f2 = Math.round(34 * sc), pad = Math.round(26 * sc), gap = Math.round(10 * sc);
  const font = '-apple-system, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif';
  x.save();
  x.font = `700 ${f1}px ${font}`; const w1 = x.measureText(t.l1 || '').width;
  x.font = `500 ${f2}px ${font}`; const w2 = t.l2 ? x.measureText(t.l2).width : 0;
  const bw = Math.max(w1, w2) + pad * 2 + (titles.style === 'clean' ? 0 : Math.round(10 * sc)), bh = f1 + (t.l2 ? f2 + gap : 0) + pad * 1.6;
  const mx = Math.round(W * 0.06), by = Math.round(H * 0.86 - bh);
  const bx = titles.align === 'center' ? Math.round((W - bw) / 2) : mx;
  const slide = (1 - k) * Math.round(-60 * sc) * (titles.align === 'center' ? 0 : 1), rise = (1 - k) * Math.round(24 * sc) * (titles.align === 'center' ? 1 : 0);
  x.globalAlpha = k; x.translate(slide, rise);
  const acc = titles.color || '#0a84ff', r = Math.round(14 * sc);
  const textX = bx + pad + (titles.style === 'clean' ? Math.round(14 * sc) : Math.round(10 * sc));
  if (titles.style === 'bar') {
    x.fillStyle = 'rgba(16,16,20,.78)'; x.beginPath(); x.roundRect(bx, by, bw * Math.min(1, pin * 1.15), bh, r); x.fill();
    x.fillStyle = acc; x.beginPath(); x.roundRect(bx, by, Math.round(8 * sc), bh, [r, 0, 0, r]); x.fill();
  } else if (titles.style === 'glass') {
    x.fillStyle = 'rgba(255,255,255,.2)'; x.strokeStyle = 'rgba(255,255,255,.45)'; x.lineWidth = Math.max(1, 2 * sc);
    x.beginPath(); x.roundRect(bx, by, bw * Math.min(1, pin * 1.15), bh, r * 1.4); x.fill(); x.stroke();
  } else if (titles.style === 'church') {
    const h1 = f1 + pad, h2 = t.l2 ? f2 + pad * .8 : 0;
    x.fillStyle = acc; x.fillRect(bx, by, Math.max(w1 + pad * 2.4, 0) * Math.min(1, pin * 1.2), h1);
    if (t.l2) { x.fillStyle = 'rgba(255,255,255,.94)'; x.fillRect(bx, by + h1, (w2 + pad * 2.4) * Math.min(1, pin * 1.1), h2); }
    x.textBaseline = 'middle';
    x.fillStyle = '#fff'; x.font = `700 ${f1}px ${font}`; x.fillText(t.l1 || '', bx + pad * 1.2, by + h1 / 2);
    if (t.l2) { x.fillStyle = '#1c1c1e'; x.font = `500 ${f2}px ${font}`; x.fillText(t.l2, bx + pad * 1.2, by + h1 + h2 / 2); }
    x.restore(); return;
  } else {                                                   // clean: text with a soft shadow and a thin accent line
    x.fillStyle = acc; x.fillRect(bx, by + pad * .5, Math.round(6 * sc), bh - pad);
    x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = 18 * sc; x.shadowOffsetY = 2 * sc;
  }

function wireTitles(el) {
  const g = [...el.querySelectorAll('.group')].find(x => x.querySelector('[data-act=tadd]')); if (!g) return;

function wirePhoneControls(b, cam) {
  const g = [...b.querySelectorAll('.group')].find(x => x.querySelector('#phoneStats')); if (!g) return;

// ---------- updates ----------
let update = { state: 'idle' };
function paintUpdate() {
  const s = $('#updState'), b = $('#updBtn'); if (!s) return;
  const txt = { idle: 'Updates install automatically when you quit.', checking: 'Checking…', current: 'You’re up to date.', downloading: `Downloading ${update.version || 'update'}${update.percent != null ? ` · ${update.percent}%` : ''}…`,
    ready: `Version ${update.version} is ready.`, error: 'Couldn’t check: ' + (update.message || 'unknown error'), dev: 'Updates work in the installed app.', unavailable: 'Updates aren’t set up in this build.' }[update.state] || '';
  s.textContent = txt; b.textContent = update.state === 'ready' ? 'Restart & update' : 'Check now'; b.classList.toggle('primary', update.state === 'ready');
}
function installUpdate() {
  if (recState.active) return toast('Stop recording first', 'err');
  NATIVE.installUpdate();
}
if (NATIVE && NATIVE.onUpdate) NATIVE.onUpdate(u => {
  const was = update.state; update = { ...update, ...u }; paintUpdate();
  if (u.state === 'ready' && was !== 'ready') toast(`Update ${u.version} downloaded. It installs when you quit, or restart from Settings.`);
});

// ---- 99-boot.js ----
// Startup: permissions, restore last session (or auto setup), first render.
async function boot() {
  const err = $('#gateErr'); err.textContent = '';
  if (!navigator.mediaDevices || !window.MediaRecorder) { err.textContent = 'This browser can’t record. Please use Chrome or Edge.'; return; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));
    s.getTracks().forEach(t => t.stop());
  } catch (e) {
    err.textContent = 'Camera and microphone access was blocked. Allow it in the address bar, then try again.';
    $('#gate').hidden = false; return;
  }
  $('#gate').hidden = true;
  await audio.init();
  await Promise.all([loadLuts(), loadFolder(), loadBackup()]);
  await refreshDevices();
  navigator.mediaDevices.addEventListener('devicechange', refreshDevices);
  const cur = store.get('current', null);
  if (cur && (cur.cams || []).length) await applySnapshot(cur);
  else { await autoSetup(); setTimeout(() => cams.length && openNameCameras(true), 500); }
  saveCurrent();
  renderAll();
  if (cams[0] && !selected) select('cam', cams[0]);
  phonesOnBoot();
  log(`Ready. Recording format ${MIME || 'browser default'}${NATIVE ? ' (Windows app)' : ''}`);
  if (EXT !== 'mp4' && !NATIVE) log('This browser records WebM. Update Chrome or Edge for MP4.');
  store.set('started', true);
}

initChrome();
$('#start').onclick = boot;
(async () => {
  // Skip the welcome screen when permission was already given
  try {
    const [c, m] = await Promise.all([navigator.permissions.query({ name: 'camera' }), navigator.permissions.query({ name: 'microphone' })]);
    if (store.get('started', false) && c.state === 'granted' && m.state === 'granted') boot();
  } catch {}
})();
