    <h1>Gadget Cam Studio</h1>
    <p>Every angle. One click.</p>
    <button class="bigbtn" id="start">Get started</button>
    <div class="err" id="gateErr"></div>
  </div>
</div>

<div id="app">
  <header class="toolbar">
    <button class="tb" id="tSide" title="Show or hide the sidebar"></button>
    <span class="title">Gadget Cam Studio</span>
    <button class="pill" id="onair" hidden style="border:0"></button>
    <div class="center">
      <button class="tb" id="tMark" title="Add marker (M)"></button>
      <button class="recbtn" id="rec" title="Record (Space)"><i></i></button>
      <span class="timer" id="timer">00:00:00</span>
    </div>
    <div class="right">
      <button class="pill" id="load" hidden style="border:0"></button>
      <span class="pill" id="health" title="Recording health"></span>
      <button class="tb" id="tMini" title="Floating mini preview of the output"></button>
      <button class="tb" id="tPrompt" title="Teleprompter"></button>
      <button class="tb" id="tSettings" title="Settings"></button>
      <button class="tb" id="tInsp" title="Show or hide the inspector"></button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="inner">
      <button class="bigbtn" id="auto"></button>
      <div>
        <div class="sec-h">Setups <button class="tb" id="addSetup" title="Save current setup"></button></div>
        <div id="setups"></div>
      </div>
      <div>
        <div class="sec-h">Cameras <span><button class="tb" id="nameCamS" title="Name your cameras"></button><button class="tb" id="addCamS" title="Add camera"></button></span></div>
        <div id="camList"></div>
      </div>
      <div>
        <div class="sec-h">Audio <button class="tb" id="addAudS" title="Add audio input"></button></div>
        <div id="audList"></div>
      </div>
      <div>
        <div class="sec-h">Output</div>
        <div id="outList"></div>
      </div>
    </div>
    <div class="foot">
      <div class="item" id="folderRow" title="Where recordings are saved"></div>
    </div>
  </aside>

  <main class="stage">
    <div id="grid"></div>
    <section class="dock" id="dock">
      <div class="dock-h">
        <button class="tb" id="dockToggle"></button>
        <b>Audio</b>
        <span class="hint" title="REC is what’s recorded. MON is what you hear. Double-click a fader to reset it."></span>
        <span style="margin-left:auto;display:flex;gap:6px">
          <span id="mixBar" style="display:flex;gap:6px"></span>
          <button class="btn" id="soundCheck"></button>
          <button class="btn" id="addAud"></button>
        </span>
      </div>
      <div class="dock-b" id="strips"></div>
    </section>
  </main>

  <aside class="inspector" id="insp"></aside>
</div>

<div id="countdown"><b></b></div>
<div id="toasts"></div>

<dialog id="settings">
  <div class="dh"><b>Settings</b><button class="tb" data-close></button></div>
  <div class="db" id="settingsBody"></div>
</dialog>

<dialog id="menu" style="width:340px">
  <div class="dh"><b id="menuTitle"></b><button class="tb" data-close></button></div>
  <div class="db" id="menuBody"></div>
</dialog>

<input type="file" id="fileLut" accept=".cube" multiple hidden>
<input type="file" id="fileImg" accept="image/*" hidden>

<script>/*__JS__*/</script>
</body>
</html>
